name: PhysioNet strong spatial motor-imagery baseline
on:
  push:
    branches:
      - research/eeg-cert-matched-selective-baseline-20261009
    paths:
      - 'research/eeg/filterbank_logeuclidean_real.py'
      - 'tests/test_filterbank_logeuclidean_real.py'
      - '.github/workflows/eeg-strong-spatial-real.yml'
  workflow_dispatch:
    inputs:
      cohort:
        description: 'Frozen cohort: mini quick check, pilot 12-subject comparison'
        type: choice
        options: [mini, pilot]
        default: mini
permissions:
  contents: read
jobs:
  unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mne==1.11.0' 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - run: python -m unittest discover -s tests -p 'test_filterbank_logeuclidean_real.py' -v
  real-spatial-feature-baseline:
    needs: unit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU EEG runtime
        run: python -m pip install 'mne==1.11.0' 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Execute source-hashed original EDF spatial log-covariance model
        env:
          COHORT: ${{ github.event.inputs.cohort || 'mini' }}
        run: |
          set -o pipefail
          python -m research.eeg.filterbank_logeuclidean_real \
            --cohort "$COHORT" \
            --data-dir "$RUNNER_TEMP/real_EEGMMIDB" \
            --out "spatial_${COHORT}_real_results.json" 2>&1 | tee eeg_spatial_console.log
      - name: Preserve raw result trace and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeg-spatial-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 60
          path: |
            spatial_*_real_results.json
            eeg_spatial_console.log

# Conventional method: no novel method or foundation-model accuracy claim.