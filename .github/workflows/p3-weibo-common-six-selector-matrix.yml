name: P3 second-acquisition Weibo2014 common source-only six-selector matrix
on:
  push:
    branches: [publication/default-eeg-p3-transfer-negative-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p3_real_weibo_common_six_selector_matrix.py'
      - '.github/workflows/p3-weibo-common-six-selector-matrix.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  weibo-source-only-common-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MNE_DATA: /tmp/p3-weibo-public
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Freeze 9-source method choices before held 10 and report 10 exploratory folds
        run: |
          mkdir -p "$MNE_DATA" /tmp/p3-weibo-matrix
          python -m py_compile research/defaultreg_bspc_v13/src/p3_real_weibo_common_six_selector_matrix.py
          python research/defaultreg_bspc_v13/src/p3_real_weibo_common_six_selector_matrix.py --out /tmp/p3-weibo-matrix
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('/tmp/p3-weibo-matrix')
          source=d/'BEFORE_SUBJECT10_SIGNAL_SOURCE_ONLY_CHOICES.json'
          paper=d/'P3_ACTUAL_WEIBO_SHARED_MATRIX_RESULTS.json'
          s=json.loads(paper.read_text())
          assert s['reserved_subject10_source_sha']==hashlib.sha256(source.read_bytes()).hexdigest()
          assert s['one_reserved_held_person_no_independent_confirmation']['reserved_targets_in_this_replay']==1
          assert len(s['all10_held_people_EXPLORATORY_not_independent'])==10
          assert 'proper_predictive_nll' in s['summary_descriptive_no_causal_inference']
          print('P3_TWO_ACQUISITION_SAME_MATRIX_REANALYSIS_COMPLETE_NOT_PROSPECTIVE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P3-WEIBO2014-REAL-SIX-SELECTOR-REANALYSIS-NOT-REGISTERED
          path: /tmp/p3-weibo-matrix/*.json
          if-no-files-found: warn
          retention-days: 90
