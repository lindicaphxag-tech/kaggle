name: P4 rational Bernstein sign certificate independent check
on:
  push:
    branches: [publication/default-eeg-p4-rank-certificates-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p4_exact_rational_bernstein_audit.py'
      - '.github/workflows/p4-exact-rational-bernstein-check.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  rational-signs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python research/defaultreg_bspc_v13/src/p4_exact_rational_bernstein_audit.py > rational_sign_audit.json
      - run: |
          python - <<'PY'
          import json
          a=json.load(open("rational_sign_audit.json"))
          assert a["exact_rational_interval_cases"]==160
          assert a["raw_EEG_or_float_end_to_end_certified"] is False
          print(a)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4-exact-rational-certificate-math-only
          path: rational_sign_audit.json
          retention-days: 90
