name: Real pretrained NeuroRVQ EEG electrode identity drift
on:
  push:
    branches:
      - research/eeg-cert-matched-selective-baseline-20261009
    paths:
      - 'research/eeg/neurorvq_pretrained_real_eeg_identity.py'
      - 'tests/test_neurorvq_real_eeg_identity.py'
      - '.github/workflows/eeg-neurorvq-real-pretrained-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neurorvq-pretrained-id-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-pretrained-encoder-on-original-edf:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install supported CPU PyTorch and audio wheels
        run: |
          python -m pip install 'torch==2.6.0' 'torchaudio==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install exact merged upstream Braindecode source with Hub support
        run: |
          git clone --filter=blob:none https://github.com/braindecode/braindecode.git /tmp/braindecode
          git -C /tmp/braindecode checkout a619f4b38333de6060811ffb8a5a4b1104551ff9
          python -m pip install '/tmp/braindecode[hub]'
      - name: Sanity check frozen provenance and restoration contracts
        run: |
          python -m unittest discover -s tests -p 'test_neurorvq_real_eeg_identity.py' -v
          python - <<'PY'
          import braindecode, torch
          from braindecode.models import NeuroRVQ
          print('PINNED_BRAINDECODE_IMPORT',braindecode.__version__,torch.__version__,NeuroRVQ)
          PY
      - name: Real S001 R04 EDF plus official NeuroRVQ pretrained checkpoint
        run: |
          set -o pipefail
          python -m research.eeg.neurorvq_pretrained_real_eeg_identity \
            --cache "$RUNNER_TEMP/eeg_original" \
            --out real_neurorvq_pretrained_eeg_identity.json 2>&1 | tee neurorvq_pretrained_identity.log
      - name: Publish original EDF SHA and real pretrained encoder drift or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pretrained-neurorvq-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 60
          path: |
            real_neurorvq_pretrained_eeg_identity.json
            neurorvq_pretrained_identity.log

# CC BY-NC 4.0 upstream model and pretrained weights: research only.
# No classifier accuracy or pretrained task-head claims.