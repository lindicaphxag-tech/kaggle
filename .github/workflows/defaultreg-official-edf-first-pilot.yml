name: Default Regularisation official EEGMMIDB strict-source pilot
on:
  push:
    branches:
      - research/defaultreg-public-edf-baseline-feasibility-20261010
    paths:
      - 'research/defaultreg_eeg/**'
      - '.github/workflows/defaultreg-official-edf-first-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-edf-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scientific stack
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 mne==1.11.0
      - name: Record environment
        run: |
          python - <<'PY'
          import json,platform,sys,numpy,scipy,sklearn,mne
          x={"python":sys.version,"platform":platform.platform(),"numpy":numpy.__version__,
             "scipy":scipy.__version__,"sklearn":sklearn.__version__,"mne":mne.__version__}
          open("research/defaultreg_eeg/environment.json","w").write(json.dumps(x,indent=2))
          print(json.dumps(x,indent=2))
          PY
      - name: Execute frozen official EDF two-target feasibility pilot
        run: |
          python research/defaultreg_eeg/run_official_edf_baselines.py \
            --edf-root research/defaultreg_eeg/edf_original \
            --out research/defaultreg_eeg/official_first_pilot
      - name: Fail closed on protocol or denominator drift
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/defaultreg_eeg/official_first_pilot/full_pilot_json.json")
          x=json.loads(p.read_text())
          assert x["source_participants"]==list(range(1,9)), x["source_participants"]
          assert x["heldout_participants"]==[9,10], x["heldout_participants"]
          assert x["target_data_used_for_training_or_hyperparam_selection"] is False
          assert x["no_task_cues_dropped"] is True
          assert len(x["source_files"])==30
          assert set(x["per_target_subject"])=={"9","10"}
          assert all(v["target_trials"]>0 for v in x["per_target_subject"].values())
          arms=set(next(iter(x["per_target_subject"].values()))["auc"])
          expected={"LedoitWolf_LDA","OAS_LDA","nested_source_macro_auc_LDA",
                    "source_signed_mean_LDA","source_squared_margin_LDA",
                    "source_tail_signed_LDA","LogisticRegression"}
          assert arms==expected,(arms,expected)
          print("STRICT_SOURCE_PROTOCOL_PASS")
          PY
      - name: Archive real raw evidence and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defaultreg-official-edf-first-pilot
          path: |
            research/defaultreg_eeg/environment.json
            research/defaultreg_eeg/FROZEN_OFFICIAL_EDF_FIRST_PILOT_20261010.md
            research/defaultreg_eeg/official_first_pilot/**
          if-no-files-found: warn
          retention-days: 90
