name: DefaultReg untouched Shin+BNCI002 validity frontier

on:
  push:
    branches:
      - research/defaultreg-frontier-shin-bnci002-20261010
    paths:
      - 'research/defaultreg_frontier/**'
      - '.github/workflows/defaultreg-frontier-shin-bnci002.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/defaultreg_frontier/**'
      - '.github/workflows/defaultreg-frontier-shin-bnci002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: synthetic-frontier-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen MOABB stack
        run: python -m pip install --disable-pip-version-check moabb==1.7.2

      - name: Compile runner and smoke test
        run: |
          python -m py_compile research/defaultreg_frontier/run_untouched_frontier.py
          python -m py_compile research/defaultreg_frontier/test_runner_synthetic.py

      - name: Run synthetic end-to-end frontier smoke test
        run: |
          cd research/defaultreg_frontier
          python test_runner_synthetic.py

  frontier-confirmatory:
    name: frontier-${{ matrix.dataset }}
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        dataset: [Shin2017A, BNCI2014_002]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: ${{ runner.temp }}/mne_data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen MOABB stack
        run: python -m pip install --disable-pip-version-check moabb==1.7.2

      - name: Execute untouched validity-frontier confirmation
        run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_frontier/run_untouched_frontier.py \
            --dataset "${{ matrix.dataset }}" \
            --out "defaultreg_frontier_${{ matrix.dataset }}"

      - name: Fail closed on provenance, denominator, Z0 and score freeze
        run: |
          DATASET="${{ matrix.dataset }}" python - <<'PY'
          import json, os, pathlib, re

          d = os.environ['DATASET']
          p = pathlib.Path(f'defaultreg_frontier_{d}/{d}_frontier_confirmatory.json')
          x = json.loads(p.read_text())

          expected_n = {'Shin2017A': 29, 'BNCI2014_002': 14}[d]
          expected_channels = {'Shin2017A': 30, 'BNCI2014_002': 15}[d]
          sha = re.compile(r'^[0-9a-f]{64}$')

          assert x['status'] == 'UNTOUCHED_FRONTIER_CONFIRMATION_EXECUTED'
          assert x['receipt_version'] == 4
          assert x['cohort_role'] == 'confirmatory'
          assert x['dataset'] == d
          assert x['code_commit'] == os.environ['GITHUB_SHA']
          assert x['workflow_run_id'] == os.environ['GITHUB_RUN_ID']
          assert x['protocol_file'] == 'FROZEN_SHIN_BNCI002_FRONTIER_20261010.md'
          assert x['outcome_interpretation_file'] == 'OUTCOME_INTERPRETATION_FREEZE_20261010.md'
          assert sha.fullmatch(x['protocol_sha256'])
          assert sha.fullmatch(x['outcome_interpretation_sha256'])
          assert sha.fullmatch(x['full_grid_sha256'])
          assert sha.fullmatch(x['dense_grid_sha256'])

          assert x['n_subjects'] == expected_n
          assert x['participant_count'] == expected_n
          assert x['subjects'] == list(range(1, expected_n + 1))
          assert x['channels_used'] == expected_channels
          assert x['feature_dimension'] == expected_channels * (expected_channels + 1) // 2
          assert len(x['participant_receipt']) == expected_n
          assert x['trial_denominator'] == sum(r['trials'] for r in x['participant_receipt'])
          assert x['trial_denominator'] == sum(f['target_trials'] for f in x['folds'])

          assert x['target_information_track'] == 'Z0'
          assert x['target_labels_used_before_score_freeze'] is False
          assert x['target_batch_statistics_used'] is False

          assert x['full_grid'][0] == 0.0 and x['full_grid'][-1] == 1.0
          assert x['dense_frontier_grid'][0] == 0.0
          assert x['dense_frontier_grid'][-1] == 1.0
          assert len(x['dense_frontier_grid']) >= 400

          assert len(x['folds']) == expected_n
          assert len(x['primary_comparisons']) == 2
          assert sha.fullmatch(x['score_manifest_sha256'])

          methods = {
              'LedoitWolf_LDA',
              'OAS_LDA',
              'source_macro_full_domain_LDA',
              'source_cov_nll_full_domain_LDA',
              'discriminability_first_lexicographic_LDA',
              'TS_LogisticRegression',
              'Riemannian_MDM',
          }
          assert set(x['mean_auc_by_method']) == methods

          seen = set()
          for fold in x['folds']:
              sid = fold['target_subject']
              assert sid not in seen
              seen.add(sid)
              assert set(fold['auc']) == methods
              assert fold['target_information_track'] == 'Z0'
              assert fold['target_labels_used_for_selection'] is False
              assert fold['target_batch_statistics_used'] is False
              assert sha.fullmatch(fold['score_freeze']['score_sha256'])
              vf = fold['validity_frontier']
              assert vf['target_path_used_for_selection'] is False
              assert vf['source_1se_lambdas']
              assert vf['source_1se_auc_span'] >= 0.0
              assert vf['max_auc_span'] >= vf['source_1se_auc_span'] - 1e-12
              assert len(vf['grid_sensitivity']) == 4
          assert seen == set(range(1, expected_n + 1))

          summary = x['frontier_summary']
          assert summary['n_participants'] == expected_n
          assert summary['raw_fidelity_budgets_not_pooled_across_participants'] is True
          assert summary['full_path_span_mean'] >= 0.0
          assert summary['source_1se_span_mean'] >= 0.0

          print('PASS_UNTOUCHED_FRONTIER_RECEIPT', d, x['trial_denominator'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-frontier-${{ matrix.dataset }}
          path: |
            research/defaultreg_frontier/FROZEN_SHIN_BNCI002_FRONTIER_20261010.md
            research/defaultreg_frontier/OUTCOME_INTERPRETATION_FREEZE_20261010.md
            defaultreg_frontier_${{ matrix.dataset }}/**
          if-no-files-found: warn
          retention-days: 90
