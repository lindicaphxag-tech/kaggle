name: DefaultReg untouched Shin+BNCI002 validity frontier

on:
  push:
    branches:
      - research/defaultreg-frontier-shin-bnci002-20261010
    paths:
      - 'research/defaultreg_frontier/**'
      - '.github/workflows/defaultreg-frontier-shin-bnci002.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/defaultreg_frontier/**'
      - '.github/workflows/defaultreg-frontier-shin-bnci002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier-confirmatory:
    strategy:
      fail-fast: false
      matrix:
        dataset: [Shin2017A, BNCI2014_002]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: ${{ runner.temp }}/mne_data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen MOABB stack
        run: python -m pip install --disable-pip-version-check moabb==1.7.2

      - name: Compile frozen frontier runner
        run: |
          python -m py_compile research/defaultreg_frontier/run_untouched_frontier.py
          python -m py_compile research/defaultreg_frontier/test_runner_synthetic.py

      - name: Run synthetic frontier smoke test
        run: |
          cd research/defaultreg_frontier
          python test_runner_synthetic.py

      - name: Execute untouched validity-frontier confirmation
        run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_frontier/run_untouched_frontier.py \
            --dataset "${{ matrix.dataset }}" \
            --out "defaultreg_frontier_${{ matrix.dataset }}"

      - name: Fail closed on denominator, Z0, score freeze and dense path
        run: |
          DATASET="${{ matrix.dataset }}" python - <<'PY'
          import json, os, pathlib, re

          d = os.environ["DATASET"]
          p = pathlib.Path(
              f"defaultreg_frontier_{d}/{d}_frontier_confirmatory.json"
          )
          x = json.loads(p.read_text())

          expected_n = {"Shin2017A": 29, "BNCI2014_002": 14}[d]
          expected_channels = {"Shin2017A": 30, "BNCI2014_002": 15}[d]

          assert x["status"] == "UNTOUCHED_FRONTIER_CONFIRMATION_EXECUTED"
          assert x["cohort_role"] == "confirmatory"
          assert x["dataset"] == d
          assert x["n_subjects"] == expected_n
          assert x["subjects"] == list(range(1, expected_n + 1))
          assert x["channels_used"] == expected_channels
          assert x["feature_dimension"] == expected_channels * (expected_channels + 1) // 2

          assert x["target_information_track"] == "Z0"
          assert x["target_labels_used_before_score_freeze"] is False
          assert x["target_batch_statistics_used"] is False

          assert x["full_grid"][0] == 0.0 and x["full_grid"][-1] == 1.0
          assert x["dense_frontier_grid"][0] == 0.0
          assert x["dense_frontier_grid"][-1] == 1.0
          assert len(x["dense_frontier_grid"]) >= 400

          assert len(x["folds"]) == expected_n
          assert len(x["participant_receipt"]) == expected_n
          assert len(x["primary_comparisons"]) == 2

          methods = {
              "LedoitWolf_LDA",
              "OAS_LDA",
              "source_macro_full_domain_LDA",
              "source_cov_nll_full_domain_LDA",
              "discriminability_first_lexicographic_LDA",
              "TS_LogisticRegression",
              "Riemannian_MDM",
          }
          assert set(x["mean_auc_by_method"]) == methods

          sha = re.compile(r"^[0-9a-f]{64}$")
          assert sha.fullmatch(x["score_manifest_sha256"])

          for f in x["folds"]:
              assert set(f["auc"]) == methods
              assert f["target_information_track"] == "Z0"
              assert f["target_labels_used_for_selection"] is False
              assert f["target_batch_statistics_used"] is False
              assert sha.fullmatch(f["score_freeze"]["score_sha256"])
              assert f["validity_frontier"]["target_path_used_for_selection"] is False
              assert len(f["validity_frontier"]["grid_sensitivity"]) == 4

          print("PASS_UNTOUCHED_FRONTIER_AUDIT", d)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-frontier-${{ matrix.dataset }}
          path: |
            research/defaultreg_frontier/FROZEN_SHIN_BNCI002_FRONTIER_20261010.md
            defaultreg_frontier_${{ matrix.dataset }}/**
          if-no-files-found: warn
          retention-days: 90
