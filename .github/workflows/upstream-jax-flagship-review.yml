name: Source-exact independent JAX numerical PR validation

on:
  push:
    branches:
      - ci/upstream-jax-flagship-review-20261011
    paths:
      - .github/workflows/upstream-jax-flagship-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-t-large-df:
    name: JAX 41227 Student-t numerical review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable JAX PR 41227 head
        uses: actions/checkout@v4
        with:
          repository: jax-ml/jax
          ref: 1d8cac844d810025b6189617508f8043631e3de6
          path: jax
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact source and JAX test prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./jax
          python -m pip install -r jax/build/test-requirements.txt
      - name: Run reviewer-requested focused regression
        working-directory: jax
        run: |
          python -m pytest -q tests/scipy_stats_test.py -k TLogPdfLargeDf
      - name: Record immutable identity and environment
        if: always()
        run: |
          {
            echo "upstream=jax-ml/jax"
            echo "pr=41227"
            echo "source_commit=$(git -C jax rev-parse HEAD)"
            echo "test=tests/scipy_stats_test.py -k TLogPdfLargeDf"
            echo "python=$(python --version)"
            python -m pip show jax jaxlib numpy scipy | grep -E '^(Name|Version):'
          } > jax-41227-validation-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jax-41227-source-exact-review-receipt
          path: jax-41227-validation-receipt.txt
          if-no-files-found: error
          retention-days: 90

  poisson-large-rate:
    name: JAX 41228 large-rate Poisson numeric review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable JAX PR 41228 head
        uses: actions/checkout@v4
        with:
          repository: jax-ml/jax
          ref: 2af46d5f0bf14c458c8ffa3ff5bd8fc395d613f7
          path: jax
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact source and JAX test prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./jax
          python -m pip install -r jax/build/test-requirements.txt
      - name: Run sampler, stable-log-PMF and independent public-API regressions
        working-directory: jax
        run: |
          python -m pytest -q tests/random_lax_test.py -k 'PoissonLargeLambdaLogPmf or PoissonRejectionLogPmfMatchesScipy or StirlingTailUsesUnclampedLargeArgument or PoissonCentralDevianceAvoidsFloat32Cancellation or PoissonLogPmfTinyRateGradientsRemainFinite or PoissonLargeLambdaVariance or BinomialLargeCountTailRegression'
          python -m pytest -q tests/scipy_stats_test.py -k 'PoissonLogPmfLargeLambda or PoissonLogPmfCentralFloat32Accurate or PoissonLogPmfPublicApiTinyRateAutodiff'
      - name: Record immutable identity and environment
        if: always()
        run: |
          {
            echo "upstream=jax-ml/jax"
            echo "pr=41228"
            echo "source_commit=$(git -C jax rev-parse HEAD)"
            echo "tests=tests/random_lax_test.py + tests/scipy_stats_test.py focused Poisson cases"
            echo "python=$(python --version)"
            python -m pip show jax jaxlib numpy scipy | grep -E '^(Name|Version):'
          } > jax-41228-validation-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jax-41228-source-exact-review-receipt
          path: jax-41228-validation-receipt.txt
          if-no-files-found: error
          retention-days: 90

  student-t-existing-api-regressions:
    name: JAX 41227 existing Student-t API regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable upstream Student-t PR
        uses: actions/checkout@v4
        with:
          repository: jax-ml/jax
          ref: 1d8cac844d810025b6189617508f8043631e3de6
          path: jax
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unmodified JAX source and test dependencies
        run: |
          python -m pip install -e ./jax
          python -m pip install -r jax/build/test-requirements.txt
      - name: Run ALL existing Student-t logpdf tests and new regression
        working-directory: jax
        run: python -m pytest -q tests/scipy_stats_test.py -k TLogPdf
      - name: Record exact SHA and dependency versions
        if: always()
        run: |
          {
            echo "pr=41227"
            echo "sha=$(git -C jax rev-parse HEAD)"
            python -m pip show jax jaxlib scipy numpy | grep -E '^(Name|Version):'
          } > jax-41227-broad.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jax-41227-broad-student-t
          path: jax-41227-broad.txt

  poisson-existing-api-regressions:
    name: JAX 41228 existing Poisson APIs and sampler regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable upstream Poisson PR
        uses: actions/checkout@v4
        with:
          repository: jax-ml/jax
          ref: 2af46d5f0bf14c458c8ffa3ff5bd8fc395d613f7
          path: jax
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unmodified JAX source and test dependencies
        run: |
          python -m pip install -e ./jax
          python -m pip install -r jax/build/test-requirements.txt
      - name: Run existing and newly introduced Poisson distribution tests
        working-directory: jax
        run: python -m pytest -q tests/scipy_stats_test.py -k Poisson
      - name: Run existing and newly introduced sampler regressions
        working-directory: jax
        run: python -m pytest -q tests/random_lax_test.py -k 'Poisson or BinomialLargeCountTailRegression or StirlingTailUsesUnclampedLargeArgument'
      - name: Record exact SHA and dependency versions
        if: always()
        run: |
          {
            echo "pr=41228"
            echo "sha=$(git -C jax rev-parse HEAD)"
            python -m pip show jax jaxlib scipy numpy | grep -E '^(Name|Version):'
          } > jax-41228-broad.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jax-41228-broad-poisson
          path: jax-41228-broad.txt
