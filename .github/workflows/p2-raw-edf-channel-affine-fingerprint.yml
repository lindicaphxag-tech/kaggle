name: P2 public EDF raw digital affine fingerprint exact-moment audit
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p2_raw_edf_channel_affine_fingerprint.py'
      - '.github/workflows/p2-raw-edf-channel-affine-fingerprint.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  synthetic-then-public-edf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MNE_DATA: /tmp/p2-raw-fingerprint-public-data
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Lock dependencies
        run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Test exact integer affine method without EEG data
        run: |
          python -m py_compile research/defaultreg_bspc_v13/src/p2_raw_edf_channel_affine_fingerprint.py
          python research/defaultreg_bspc_v13/src/p2_raw_edf_channel_affine_fingerprint.py --self-test
      - name: Compare exposed Liu2024 candidate and control EDF integer streams
        run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_bspc_v13/src/p2_raw_edf_channel_affine_fingerprint.py --out /tmp/p2-raw-affine-digital-only.json
          python - <<'PY'
          import json
          with open('/tmp/p2-raw-affine-digital-only.json') as f:
              o = json.load(f)
          assert len(o['pairs']) == 5
          assert [p['public_released_ids'] for p in o['pairs']] == [[4,5],[47,49],[11,15],[2,3],[6,7]]
          assert all(p['not_physical_units_patient_identity_or_acquisition_origin'] for p in o['pairs'])
          assert all(p['n_exact_digital_channels'] <= p['raw_edf_channels'] for p in o['pairs'])
          print('RAW_EDF_AFFINE_AUDIT_EXECUTED_WITH_REPORTED_LIMITATIONS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P2-RAW-EDF-EXACT-MOMENT-AFFINE-AUDIT-NO-PATIENT-ID
          path: /tmp/p2-raw-affine-digital-only.json
          if-no-files-found: warn
          retention-days: 90
