name: P2 external CHB-MIT real EDF coherence and informed baselines
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths:
      - "research/defaultreg_bspc_v13/src/p2_external_chbmit_shared_clock.py"
      - ".github/workflows/p2-external-chbmit-coherent-provenance.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  external-corpus-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install limited deps for byte-level digital EDF verification
        run: python -m pip install --disable-pip-version-check "numpy<3" scipy
      - name: Independently download CHB-MIT EDF prefixes and evaluate frozen rules
        env:
          P2_OUTPUT: p2_chbmit_external
        run: |
          python research/defaultreg_bspc_v13/src/p2_external_chbmit_shared_clock.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("p2_chbmit_external/CHBMIT_EXTERNAL_COHERENCE_20261015.json")
          j=json.loads(p.read_text())
          assert j["status"]=="REAL_PUBLISHED_CHBMIT_DIGITAL_PREFIX_CONTROLLED_TRANSFORMS"
          assert len(j["cases"])==26 and len(j["EDF_prefix_provenance"])==2
          assert j["pre_frozen"]["threshold_abs_correlation"]==.985
          assert j["pre_frozen"]["minimum_channels"]==4
          for rel,v in j["EDF_prefix_provenance"].items():
              assert v["prefix_bytes"]>=200000 and len(v["sha256_prefix"])==64
              assert len(v["chosen_eeg_labels"])==8
          print("FROZEN_EXTERNAL_EEG_CASE_QA",j["summary"])
          print("JSON_SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P2-CHBMIT-independent-real-EEG-controlled-strong-baseline-receipt
          path: p2_chbmit_external/
          if-no-files-found: warn
          retention-days: 90
