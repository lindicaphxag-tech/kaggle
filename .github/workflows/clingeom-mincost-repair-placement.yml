name: ClinGeom minimum-cost pre-fusion repair placement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/medical_geometry/repair_placement.py'
      - 'research/medical_geometry/test_repair_placement.py'
      - 'research/medical_geometry/MIN_COST_REPAIR_PLACEMENT.md'
      - '.github/workflows/clingeom-mincost-repair-placement.yml'

jobs:
  exhaustively-verify-planner:
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q research/medical_geometry/test_repair_placement.py
