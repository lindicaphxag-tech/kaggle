name: SemRepair frozen third-party Reacher SAC independent postpilot holdout
on:
  pull_request:
    paths:
      - 'research/semrepair/external_reacher_sealed_holdout.py'
      - 'research/semrepair/test_external_reacher_sealed_holdout.py'
      - 'research/semrepair/frozen_external_reacher_sac.py'
      - 'research/semrepair/strong_clipped_actuator_oracle.py'
      - '.github/workflows/semrepair-external-sealed-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-frozen-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official external model and Reacher runtime
        run: python -m pip install "gymnasium[mujoco]==1.1.1" "stable-baselines3==2.6.0" "huggingface-hub==0.34.4"
      - name: Verify held-out inventory and exact double-clip action oracle
        run: |
          python -m unittest -v research.semrepair.test_strong_clipped_actuator_oracle research.semrepair.test_external_reacher_sealed_holdout
      - name: Run ALL frozen policy faults and action-matched controls
        run: |
          python -m research.semrepair.external_reacher_sealed_holdout > sealed_external_reacher_full.json
      - name: Report each fault level including failures
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('sealed_external_reacher_full.json'))
          print('HOLDOUT_IDENTITY',r['scenario_sha256'],r['checkpoint_sha256'])
          print('ROW_COUNT',len(r['raw_rows']))
          for key,value in sorted(r['summary'].items()):
              print(key, 'mean_reward',round(value['average_official_return'],6),
                    'distance',round(value['average_mean_tip_distance'],6),
                    'hit',str(value['ever_hit_0075_count'])+'/'+str(value['episodes']),
                    'clip_events',value['total_inner_clip_events'])
          for name,vals in sorted(r['paired'].items()):
              print('PAIRED',name,'source minus oracle',round(vals['mean_reward_improvement_source_vs_exact_oracle'],6),
                    'better/worse/tie',vals['source_better_seed_count'],vals['source_worse_seed_count'],vals['tied_seed_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-official-reacher-postpilot-32seed-fivefault-raw
          path: sealed_external_reacher_full.json
          if-no-files-found: warn
          retention-days: 90
