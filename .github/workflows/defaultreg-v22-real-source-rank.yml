name: DefaultReg V22 real held-source EEG rank-transition audit
on:
  push:
    branches:
      - research/defaultreg-v22-pairwise-rank-mechanism-20261012
    paths:
      - 'research/defaultreg_bspc_v13/src/**'
      - '.github/workflows/defaultreg-v22-real-source-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-bnci14-first-person:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: /tmp/defaultreg-v22-mne-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original EEG pipeline environment
        run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Validate frozen source code and rank-reconstruction tool
        run: |
          python -m py_compile research/defaultreg_proper_predictive/original_frozen_runner.py research/defaultreg_bspc_v13/src/run_real_source_rank_v22.py research/defaultreg_bspc_v13/src/source_rank_churn_v22.py
          python -m unittest discover -v -s research/defaultreg_bspc_v13/tests -p 'test_source_rank_churn_v22.py'
      - name: Execute source-only BNCI2014_002 outer-person-1 diagnostic WITHOUT using held-target labels
        run: |
          mkdir -p "$MNE_DATA" /tmp/defaultreg-v22
          python research/defaultreg_bspc_v13/src/run_real_source_rank_v22.py --dataset BNCI2014_002 --outer-person 1 --out /tmp/defaultreg-v22/BNCI2014_002_outer1_source_only.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/defaultreg-v22/BNCI2014_002_outer1_source_only.json')
          d=json.loads(p.read_text())
          assert d['status']=='SOURCE_ONLY_POSTHOC_MECHANISM_NOT_PROSPECTIVE_EFFECT'
          assert d['n_participants']==d['source_participant_count']==13
          assert d['held_target_labels_used_in_this_diagnostic'] is False
          assert d['analysis_scope']=='source_validation'
          assert abs(d['macro_auc_delta_exact']-(d['macro_auc_after']-d['macro_auc_before']))<1e-12
          print('PASS_V22_REAL_SOURCE_RANK_DIAGNOSTIC_BNCI2014_002_OUTER1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v22-real-source-rank-bnci002-outer1-posthoc
          path: /tmp/defaultreg-v22/**
          if-no-files-found: warn
          retention-days: 90
