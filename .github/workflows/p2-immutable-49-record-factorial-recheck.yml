name: P2 BSPC independently repeat 49-record immutable artifact factorial audit
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths: ['.github/workflows/p2-immutable-49-record-factorial-recheck.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p2-audit-all-49-real-records:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Download original immutable 49-record EEG matrix from first frozen workflow
        uses: actions/download-artifact@v4
        with:
          name: defaultreg-v29-real-49-record-crossed-model-regularisation-four-cells
          run-id: 38290349868
          github-token: ${{ github.token }}
          path: /tmp/original-v29-49
      - name: Independently verify all 49 x 3 methods x 4 cells, SHA and original numerical claims
        run: |
          cd /tmp/original-v29-49
          find . -type f -print
          test "$(find . -name 'CROSSED_MODEL_SELECTION_49_GROUPS.json' | wc -l)" -eq 1
          zip -qr /tmp/source-v29-artifact.zip .
          cd "$GITHUB_WORKSPACE"
          python research/defaultreg_bspc_v13/src/verify_v30_crossed_immutable_artifact.py             /tmp/source-v29-artifact.zip --out /tmp/p2-independent-49-record-factorial-audit.json
          python - <<'PY'
          import json
          z=json.load(open('/tmp/p2-independent-49-record-factorial-audit.json'))
          assert z['status']=='V30_PASS_IMMUTABLE_49_RECORD_CROSSED_REANALYSIS'
          assert z['n_groups']==49
          assert z['no_causal_leakage_or_independent_patients_claim']
          m=z['results']['source_macro']
          mm=m['matched_mean_auc']
          ks=['AA_old_fit_old_lambda','AB_old_fit_purged_lambda','BA_purged_fit_old_lambda','BB_purged_fit_purged_lambda']
          vals=[mm[k] for k in ks]
          for a,b in zip(vals,[.588673,.587347,.580765,.582551]):
            assert abs(a-b)<2e-6,(a,b)
          assert m['n_lambda_changed']==37
          print('P2_REAL_49_RECORD_AUDIT_INDEPENDENT_SHA_MATCH',z['original_v29_sha256'])
          print('P2_REAL_49_RECORD_CROSSED_FOUR_CELLS',vals)
          print('P2_CONCLUSION_NOT_PATIENT_IDENTITY_OR_CAUSAL_LEAKAGE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-P2-49-record-v29-independent-audit-source-sha
          path: /tmp/p2-independent-49-record-factorial-audit.json
          if-no-files-found: warn
          retention-days: 90
