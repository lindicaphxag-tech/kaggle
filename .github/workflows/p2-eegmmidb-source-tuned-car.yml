name: P2 EEGMMIDB source-tuned informed CAR fairness study
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-eegmmidb-source-tuned-car.yml'
      - 'research/defaultreg_bspc_v13/src/p2_eegmmidb_source_tuned_car_fairtest.py'
      - 'research/defaultreg_bspc_v13/src/p2_v9_cross_corpus_eegmmidb_frozen_car.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_tuned_fairtest:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      P2_OUTPUT: p2_eegmmidb_source_tuned_results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' 'scipy<2'
      - name: Fit CAR only on S001 and S002 and evaluate S009 to S014
        run: python research/defaultreg_bspc_v13/src/p2_eegmmidb_source_tuned_car_fairtest.py
      - name: Preserve chosen policy and original-source case rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-eegmmidb-source-only-tuned-CAR-fairness
          path: p2_eegmmidb_source_tuned_results/
          if-no-files-found: warn
