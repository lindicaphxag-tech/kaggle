name: SemRepair real ManiSkill source active counterexample repair and proof audit
on:
  pull_request:
    paths:
      - 'research/semrepair/active_contract_patch_synthesis.py'
      - 'research/semrepair/test_active_contract_patch_synthesis.py'
      - '.github/workflows/semrepair-maniskill-active-contract-program-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-typed-source-patch-search:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original pinned upstream torch and symbolic identities
        run: python -m pip install "torch==2.7.1" "sympy==1.14.0"
      - name: Independently test overfitting, live upstream source, symbolic proof and permission refusals
        run: python -m unittest -v research.semrepair.test_active_contract_patch_synthesis
      - name: Freeze all 7 original-code source patch candidates with actual 128 unseen asymmetric outcomes
        run: python -m research.semrepair.active_contract_patch_synthesis > real_maniskill_active_source_synthesis.json
      - name: Report full source identity, training plausible overfit count, extra probes, heldout
        run: |
          python - <<'PY'
          import json
          r=json.load(open('real_maniskill_active_source_synthesis.json'))
          for key in ('vendor_original_controller_source_SHA256',
                      'candidate_count','training_plausible_candidate_count',
                      'training_overfit_wrong_candidate_count',
                      'active_probes_selected_count','active_remaining_candidate_count',
                      'active_wrong_candidate_count',
                      'symbolically_certified_remaining_patch_count',
                      'selected_minimal_verified_AST_patch',
                      'heldout_distinct_asymmetric_config_action_examples',
                      'actual_upstream_torch_kernel_executions',
                      'source_permission_decision'):
              print(key,r[key])
          print('ACTIVE_PROBE',r['active_probe'])
          for row in r['heldout_result_per_candidate']:
              print('HELDOUT',row['patch_id'],row['cases_passed'],row['cases_failed'],
                    round(row['mean_max_action_error'],8))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-genuine-maniskill-AST-active-counterexample-search-seven-candidates
          path: real_maniskill_active_source_synthesis.json
          if-no-files-found: warn
          retention-days: 90
