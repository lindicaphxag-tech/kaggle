name: Prospective 16-subject active electrode identity verification
on:
  push:
    branches:
      - research/eeg-cert-matched-selective-baseline-20261009
    paths:
      - '.github/workflows/eeg-active-identity-prospective.yml'
      - 'research/eeg/PROSPECTIVE_ACTIVE_PROVENANCE_V1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preoutcome-proof-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mne==1.11.0' 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Verify model-agnostic minmax policy and frozen real assay
        run: |
          python -m unittest discover -s tests -p 'test_active_provenance_queries.py' -v
          python -m unittest discover -s tests -p 'test_active_provenance_optimality.py' -v
          python -m unittest discover -s tests -p 'test_active_provenance_frozen_model_table.py' -v
          python -m unittest discover -s tests -p 'test_active_identity_real_assay.py' -v
  prospective-edf-test:
    needs: preoutcome-proof-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned source and scientific compute
        run: python -m pip install 'mne==1.11.0' 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Process 48 original EDFs and keep subjects 13-16 as untouched test
        run: |
          set -o pipefail
          python -m research.eeg.active_identity_real_assay \
            --cohort prospective \
            --data-dir "$RUNNER_TEMP/EEGMMIDB" \
            --out eeg_prospective_active_identity.json 2>&1 | tee eeg_prospective_console.log
      - name: Upload signed-source audit, all trial outcomes, and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-eeg-provenance-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            eeg_prospective_active_identity.json
            eeg_prospective_console.log

# No pretrained foundation model is used in this stage.
# No independent third-party review or new accuracy gain is assumed.