name: P2 V9 cross-acquisition EEGMMIDB frozen-comparator
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-v9-eegmmidb-crosscorpus.yml'
      - 'research/defaultreg_bspc_v13/src/p2_v9_cross_corpus_eegmmidb_frozen_car.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed_comparators_external_eeg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      P2_OUTPUT: p2_v9_cross_corpus_artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy<3' 'scipy<2'
      - name: Reproduce frozen CHB-MIT thresholds on EEGMMIDB source signals
        run: python research/defaultreg_bspc_v13/src/p2_v9_cross_corpus_eegmmidb_frozen_car.py
      - name: Archive per-original and per-variant receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v9-cross-acquisition-eegmmidb
          path: p2_v9_cross_corpus_artifact/
          if-no-files-found: warn
