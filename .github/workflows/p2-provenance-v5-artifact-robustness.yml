name: P2 V5 real EEG common-artifact challenge
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-provenance-v5-artifact-robustness.yml'
      - 'research/defaultreg_bspc_v13/src/p2_provguard_v5_artifact_residual.py'
      - 'research/defaultreg_bspc_v13/src/p2_provguard_v5_six_edf_artifact_challenge.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p2_v5_artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      P2_OUTPUT: p2_v5_artifact_results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' 'scipy<2'
      - run: python research/defaultreg_bspc_v13/src/p2_provguard_v5_six_edf_artifact_challenge.py
      - name: Case-level scientific receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provguard-v5-artifact-hard-negatives
          path: p2_v5_artifact_results/
          if-no-files-found: warn
