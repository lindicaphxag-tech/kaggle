name: ClinGeom public core artifact

on:
  pull_request:
    paths:
      - "research/medical_geometry/**"
      - "CLINGEOM_PUBLIC_ARTIFACT.md"
      - "REPRODUCE_CLINGEOM.md"
      - "README.md"
      - "CITATION.cff"
      - ".github/workflows/clingeom-core-artifact.yml"
  push:
    branches:
      - main
      - artifact/clingeom-v0
    paths:
      - "research/medical_geometry/**"
      - "CLINGEOM_PUBLIC_ARTIFACT.md"
      - "REPRODUCE_CLINGEOM.md"
      - "README.md"
      - "CITATION.cff"
      - ".github/workflows/clingeom-core-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Exact contracts and repair synthesis
        run: |
          python -m pytest -q \
            research/medical_geometry/test_clingeom.py \
            research/medical_geometry/test_lattice_bundle.py \
            research/medical_geometry/test_repair_synthesis.py \
            research/medical_geometry/test_repair_certificate.py \
            research/medical_geometry/test_interpolation_certificate.py \
            research/medical_geometry/test_prompt_representation.py
      - name: Produce deterministic NumPy evidence
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_clingeom.py | tee clingeom-report.json
          PYTHONPATH=. python research/medical_geometry/benchmark_prompt_representation.py | tee prompt-representation-report.txt
          PYTHONPATH=. python research/medical_geometry/benchmark_lattice_collapse.py | tee lattice-collapse-report.json
          {
            echo "### ClinGeom deterministic evidence — Python ${{ matrix.python-version }}"
            echo
            echo '```json'
            cat clingeom-report.json
            echo '```'
            echo
            echo '```text'
            cat prompt-representation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload NumPy evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-numpy-evidence
          path: |
            clingeom-report.json
            prompt-representation-report.txt
            lattice-collapse-report.json

  torch-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile, type-check, repair and rewrite PyTorch graphs
        run: |
          python -m pytest -q \
            research/medical_geometry/test_torch_geometry.py \
            research/medical_geometry/test_torch_fx_geometry.py \
            research/medical_geometry/test_torch_fx_bundle.py \
            research/medical_geometry/test_torch_repair.py \
            research/medical_geometry/test_torch_repair_dtype.py \
            research/medical_geometry/test_channel_fiber_runtime.py \
            research/medical_geometry/test_torch_repair_certificate.py \
            research/medical_geometry/test_fx_geometry.py \
            research/medical_geometry/test_fx_rewrite.py \
            research/medical_geometry/test_fx_postcondition.py \
            research/medical_geometry/test_interpolation_fx_gate.py
      - name: Prove preservation of large segmentation-label identifiers
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_lossless_labels.py | tee lossless-label-report.json
          {
            echo '### ClinGeom categorical transport: float32 baseline vs lossless path'
            echo '```json'
            cat lossless-label-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload label-transport negative control
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-lossless-label-evidence
          path: lossless-label-report.json
      - name: Produce channel-fiber evidence
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_channel_fibers.py | tee channel-fiber-report.json
          {
            echo "### ClinGeom channel-fiber evidence"
            echo
            echo '```json'
            cat channel-fiber-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload channel-fiber evidence
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-channel-fiber-evidence
          path: channel-fiber-report.json

  monai-dints-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audited external runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "git+https://github.com/Project-MONAI/MONAI.git@efb240ac97fcb619d842b2c7872d7db942eb7cd9"
      - name: Validate MONAI DiNTS channel-fiber witness
        run: |
          python -m pytest -q research/medical_geometry/test_monai_dints_runtime.py | tee monai-dints-runtime.txt
      - name: Measure controlled patient-space fiber readout with real MONAI block
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_monai_dints_fiber_repair.py | tee monai-fiber-repair.json
          {
            echo '### MONAI actual runtime, analytic patient-coordinate field'
            echo '```json'
            cat monai-fiber-repair.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clingeom-monai-fiber-repair-evidence
          path: monai-fiber-repair.json
      - name: Test curvature-gated nonlinear repair in pinned MONAI runtime
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_monai_dints_quadratic_bound.py | tee monai-quadratic-bound.json
          {
            echo '### MONAI nonlinear feature-fiber repair, sharp analytic curvature envelope'
            echo '```json'
            cat monai-quadratic-bound.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clingeom-monai-curvature-bound-evidence
          path: monai-quadratic-bound.json
      - name: Test model-weight-derived patient-space curvature proof
        run: |
          python -m pytest -q research/medical_geometry/test_weight_curvature.py
          PYTHONPATH=. python research/medical_geometry/benchmark_weight_derived_monai.py | tee monai-weight-curvature.json
          {
            echo '### MONAI linear-weight C2 propagation and numerical residual'
            echo '```json'
            cat monai-weight-curvature.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clingeom-monai-weight-curvature-evidence
          path: monai-weight-curvature.json
      - name: Certify unchanged default ReLU/InstanceNorm MONAI topology
        run: |
          python -m pytest -q research/medical_geometry/test_default_monai_curvature.py
          PYTHONPATH=. python research/medical_geometry/benchmark_default_monai_curvature.py | tee default-monai-conditional-c2.json
          {
            echo '### Conditional Hessian transport through actual default MONAI activation and normalization'
            echo '```json'
            cat default-monai-conditional-c2.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clingeom-default-monai-conditional-c2
          path: default-monai-conditional-c2.json
      - name: Upload pinned MONAI witness
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-monai-dints-witness
          path: monai-dints-runtime.txt
