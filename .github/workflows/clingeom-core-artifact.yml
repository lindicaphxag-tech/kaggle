name: ClinGeom public core artifact

on:
  pull_request:
    paths:
      - "research/medical_geometry/**"
      - "CLINGEOM_PUBLIC_ARTIFACT.md"
      - ".github/workflows/clingeom-core-artifact.yml"
  push:
    branches:
      - artifact/clingeom-v0
    paths:
      - "research/medical_geometry/**"
      - "CLINGEOM_PUBLIC_ARTIFACT.md"
      - ".github/workflows/clingeom-core-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Exact contracts and repair synthesis
        run: |
          python -m pytest -q             research/medical_geometry/test_clingeom.py             research/medical_geometry/test_lattice_bundle.py             research/medical_geometry/test_repair_synthesis.py
          PYTHONPATH=. python research/medical_geometry/benchmark_clingeom.py
          PYTHONPATH=. python research/medical_geometry/benchmark_channel_fibers.py

  torch-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile, type-check, repair and rewrite PyTorch graphs
        run: |
          python -m pytest -q             research/medical_geometry/test_torch_geometry.py             research/medical_geometry/test_torch_fx_geometry.py             research/medical_geometry/test_torch_fx_bundle.py             research/medical_geometry/test_torch_repair.py             research/medical_geometry/test_fx_geometry.py             research/medical_geometry/test_fx_rewrite.py


  monai-dints-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audited external runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "git+https://github.com/Project-MONAI/MONAI.git@efb240ac97fcb619d842b2c7872d7db942eb7cd9"
      - name: Validate MONAI DiNTS channel-fiber witness
        run: python -m pytest -q research/medical_geometry/test_monai_dints_runtime.py
