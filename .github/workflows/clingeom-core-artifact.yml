name: ClinGeom public core artifact

on:
  pull_request:
    paths:
      - "research/medical_geometry/**"
      - "CLINGEOM_PUBLIC_ARTIFACT.md"
      - "REPRODUCE_CLINGEOM.md"
      - "README.md"
      - "CITATION.cff"
      - ".github/workflows/clingeom-core-artifact.yml"
  push:
    branches:
      - main
      - artifact/clingeom-v0
    paths:
      - "research/medical_geometry/**"
      - "CLINGEOM_PUBLIC_ARTIFACT.md"
      - "REPRODUCE_CLINGEOM.md"
      - "README.md"
      - "CITATION.cff"
      - ".github/workflows/clingeom-core-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy pytest
      - name: Exact contracts and repair synthesis
        run: |
          python -m pytest -q \
            research/medical_geometry/test_clingeom.py \
            research/medical_geometry/test_lattice_bundle.py \
            research/medical_geometry/test_repair_synthesis.py \
            research/medical_geometry/test_repair_certificate.py \
            research/medical_geometry/test_prompt_representation.py
      - name: Produce deterministic NumPy evidence
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_clingeom.py | tee clingeom-report.json
          PYTHONPATH=. python research/medical_geometry/benchmark_prompt_representation.py | tee prompt-representation-report.txt
          PYTHONPATH=. python research/medical_geometry/benchmark_lattice_collapse.py | tee lattice-collapse-report.json
          {
            echo "### ClinGeom deterministic evidence — Python ${{ matrix.python-version }}"
            echo
            echo '```json'
            cat clingeom-report.json
            echo '```'
            echo
            echo '```text'
            cat prompt-representation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload NumPy evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-numpy-evidence
          path: |
            clingeom-report.json
            prompt-representation-report.txt
            lattice-collapse-report.json

  torch-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile, type-check, repair and rewrite PyTorch graphs
        run: |
          python -m pytest -q \
            research/medical_geometry/test_torch_geometry.py \
            research/medical_geometry/test_torch_fx_geometry.py \
            research/medical_geometry/test_torch_fx_bundle.py \
            research/medical_geometry/test_torch_repair.py \
            research/medical_geometry/test_torch_repair_certificate.py \
            research/medical_geometry/test_fx_geometry.py \
            research/medical_geometry/test_fx_rewrite.py \
            research/medical_geometry/test_fx_postcondition.py
      - name: Produce channel-fiber evidence
        run: |
          PYTHONPATH=. python research/medical_geometry/benchmark_channel_fibers.py | tee channel-fiber-report.json
          {
            echo "### ClinGeom channel-fiber evidence"
            echo
            echo '```json'
            cat channel-fiber-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload channel-fiber evidence
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-channel-fiber-evidence
          path: channel-fiber-report.json

  monai-dints-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audited external runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "git+https://github.com/Project-MONAI/MONAI.git@efb240ac97fcb619d842b2c7872d7db942eb7cd9"
      - name: Validate MONAI DiNTS channel-fiber witness
        run: |
          python -m pytest -q research/medical_geometry/test_monai_dints_runtime.py | tee monai-dints-runtime.txt
      - name: Upload pinned MONAI witness
        uses: actions/upload-artifact@v4
        with:
          name: clingeom-monai-dints-witness
          path: monai-dints-runtime.txt
