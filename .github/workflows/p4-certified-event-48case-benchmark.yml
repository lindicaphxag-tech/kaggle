name: P4 certificate-pruned exact AUC vs strong incremental
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p4-certified-event-48case-benchmark.yml'
      - 'research/defaultreg_bspc_v13/src/p4_certificate_pruned_incident_auc_20261015.py'
      - 'research/defaultreg_bspc_v13/src/p4_certified_path_48case_benchmark_20261015.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact arithmetic and paired statistics
        run: python -m pip install 'sympy==1.14.0' 'scipy<2' 'numpy<3'
      - name: Execute 48 feasible rational exact AUC paths
        working-directory: research/defaultreg_bspc_v13/src
        run: python p4_certified_path_48case_benchmark_20261015.py
      - name: Upload complete paired measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-exact-certificate-pruned-48-feasible-paths
          path: research/defaultreg_bspc_v13/src/p4_certificate_benchmark_results.json
          if-no-files-found: warn
