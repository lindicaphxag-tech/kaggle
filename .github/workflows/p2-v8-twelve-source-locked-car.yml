name: P2 V8 twelve original CHB-MIT sources frozen CAR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-v8-twelve-source-locked-car.yml'
      - 'research/defaultreg_bspc_v13/src/p2_v8_twelve_originals_locked_car.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twelve_originals_tuned_car:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      P2_OUTPUT: p2_v8_twelve_source_results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy<3' 'scipy<2'
      - name: Execute twelve-EDF fixed-threshold artifact challenge
        run: python research/defaultreg_bspc_v13/src/p2_v8_twelve_originals_locked_car.py
      - name: Upload per-original and per-variant cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v8-twelve-originals-controlled-cases
          path: p2_v8_twelve_source_results/
          if-no-files-found: warn
