name: SemRepair genuinely merged LeRobot 4656 stacked state false-roundtrip patch benchmark
on:
  pull_request:
    paths:
      - 'research/semrepair/real_merged_lerobot_stacked_state_synthesis.py'
      - 'research/semrepair/test_real_merged_lerobot_stacked_state_synthesis.py'
      - '.github/workflows/semrepair-real-merged-lerobot-4656-stacked-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-merged-upstream-torch-anchor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public publisher-required Torch for ORIGINAL source code
        run: python -m pip install "torch==2.7.1"
      - name: Exact publisher source blob and 96 stacked observation source patch conformance tests
        run: python -m unittest -v research.semrepair.test_real_merged_lerobot_stacked_state_synthesis
      - name: Record all six before/after real publisher Torch source mutation outcomes
        run: python -m research.semrepair.real_merged_lerobot_stacked_state_synthesis > actual_merged_LeRobot_4656_6patches_raw.json
      - name: Disclose roundtrip tests with false sense of source semantic correctness
        run: |
          python - <<'PY'
          import json
          r=json.load(open('actual_merged_LeRobot_4656_6patches_raw.json'))
          print('MERGED_UPSTREAM',r['actual_MERGED_external_PR'])
          print('PUBLISHER_MERGE_COMMIT',r['actual_merged_commit'])
          print('CASES',r['case_count'])
          print('REAL_RESET_AST',r['original_merged_reset_method_evidence'])
          print('EVAL_RESET_PATH',r['real_eval_rollout_reset_source'])
          for name,v in r['results'].items():
              print('PATCH',name,'OLD_CRASH',v['stacked_exceptions'],
                    'ROUNDTRIP_OK',v['stacked_roundtrip_pass'],
                    'ACTUAL_MODEL_FRAME0_CONTRACT_OK',v['conditioning_anchor_pass'],
                    'MEAN_HIDDEN_ANCHOR_ERROR',v['mean_max_relative_action_error_against_frame0'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-real-upstream-merged-LeRobot-4656-roundtrip-overfit-96
          path: actual_merged_LeRobot_4656_6patches_raw.json
          if-no-files-found: warn
          retention-days: 90
