name: SemRepair Ed25519 source-code configuration activation and native robot evidence
on:
  pull_request:
    paths:
      - 'research/semrepair/signed_source_activation.py'
      - 'research/semrepair/test_signed_source_activation.py'
      - 'research/semrepair/signed_patch_reacher_pusher_task.py'
      - 'research/semrepair/test_signed_patch_pusher_task.py'
      - '.github/workflows/semrepair-signed-source-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-byte-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent cryptography and official native Pusher physics
        run: python -m pip install "cryptography==45.0.7" "gymnasium[mujoco]==1.1.1" "stable-baselines3==2.6.0" "huggingface-hub==0.34.4"
      - name: Run independently checkable Ed25519 quorum, replay, forged-byte and native arm tests
        run: python -m unittest -v research.semrepair.test_signed_source_activation
      - name: Re-run official frozen expert through actual signed on-disk source patch activation
        run: |
          python -m unittest -v research.semrepair.test_signed_patch_pusher_task
          python -m research.semrepair.signed_patch_reacher_pusher_task > signed_pusher_actual_file_execution.json
      - name: Report full original task effect after real signed file swap
        run: |
          python - <<'PY'
          import json
          r=json.load(open('signed_pusher_actual_file_execution.json'))
          print('SIGNED_ACTIVATION',r['activation_record']['decision'])
          print('TEST_ONLY_ISSUERS',r['activation_record']['verified_distinct_root_issuers'])
          print('INSTALLED_SHA256',r['source_file_installed_sha256'])
          print('OFFICIAL_ROBOT_EPS',r['episode_count'])
          for arm,x in sorted(r['summary'].items()):
              print('ARM',arm,x['n_episodes'],round(x['mean_official_return'],6),
                    round(x['mean_real_object_goal_distance'],6))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-signed-real-file-activated-pusher-tasks
          path: signed_pusher_actual_file_execution.json
          if-no-files-found: warn
          retention-days: 90
