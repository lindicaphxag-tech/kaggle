name: ClinGeom prospective next 6 patients after negative first cohort

on:
  pull_request:
    paths:
      - "research/medical_geometry/upstream_repros/fetch_external_expert_holdout.py"
      - "research/medical_geometry/upstream_repros/brainmask_external_annotated.py"
      - ".github/workflows/clingeom-prospective-next-six-mri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  externally-annotated-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTEROP_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      OMP_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install public MRI/source metadata and NIfTI validation
        run: |
          python -m pip install "numpy==1.24.3" "scipy==1.9.3" "nibabel==3.2.2" "huggingface_hub==0.35.3" "pyyaml==6.0" "pytest==7.4.4"
      - name: Acquire independently released annotated T1 MRIs without reading masks for selection
        run: |
          python -m research.medical_geometry.upstream_repros.fetch_external_expert_holdout \
            --output-root prospective_holdout --synthstrip-subjects 6 --selection-offset 8 --skip-nfbs
          python - <<'PY'
          import json
          import nibabel as nib
          import numpy as np
          from pathlib import Path
          manifest=json.loads(Path("prospective_holdout/external_subject_manifest.json").read_text())
          assert manifest["data_selection_label_blind"]
          assert manifest["frozen_public_cohort_offset"] == 8
          assert not manifest["nfbs_included"]
          assert len(manifest["subjects"]) == 6
          assert len(set(r["independent_subject"] for r in manifest["subjects"])) == 6
          for case in manifest["subjects"]:
              folder=Path(case["directory"])
              x=nib.load(str(folder/"image.nii.gz"))
              y=nib.load(str(folder/"mask.nii.gz"))
              if x.shape != y.shape or not np.allclose(x.affine,y.affine,rtol=0,atol=1e-4):
                  raise ValueError("External manually refined annotation is not exactly in input MRI physical grid")
              if min(x.shape) < 64:
                  raise ValueError("No common 64-cube available")
              if not np.isfinite(x.affine).all() or abs(np.linalg.det(x.affine[:3,:3]))<1e-8:
                  raise ValueError("Invalid MRI patient-space affine")
          print("PASS six external independent public source MRI+label pairs in matching patient grids")
          PY
      - name: Install unchanged original pretrained CPU TensorFlow runtime
        run: |
          python -m pip install "tensorflow-cpu==2.13.0" "matplotlib==3.7.2"
      - name: Retrieve immutable original learned model implementation and weights
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ecalabr/brain_mask/ca789fb26b70e359b61a8d52968813dd772fb4b1"
          mkdir -p original/model original/utilities
          touch original/model/__init__.py original/utilities/__init__.py
          curl -fL --retry 3 "$base/utilities/input_fn_util.py" -o original/utilities/input_fn_util.py
          curl -fL --retry 3 "$base/utilities/normalizers.py" -o original/utilities/normalizers.py
          curl -fL --retry 3 "$base/model/networks.py" -o original/model/networks.py
          curl -fL --retry 3 "$base/model/network_layers.py" -o original/model/network_layers.py
          curl -fL --retry 3 "$base/utilities/activations.py" -o original/utilities/activations.py
          curl -fL --retry 3 "$base/trained_models/t1/t1.yml" -o t1.yml
          curl -fL --retry 3 "$base/trained_models/t1/checkpoints/epoch_20_trainloss_128841.2266.hdf5" -o official.hdf5
          test "$(git hash-object original/utilities/input_fn_util.py)" = 1c2ce1a9f13f690cdaf28eac5b003e44ec06d192
          test "$(git hash-object original/utilities/normalizers.py)" = 98eb8c4329ed2330b47905ab2e69ac1a5fdb5237
          test "$(git hash-object original/model/networks.py)" = 7af8f0079b38af6fbac82923d3bc2c4cd445faca
          test "$(git hash-object original/model/network_layers.py)" = 95eac930ca13df35ac7e1a6d53337c79e7c7d148
          test "$(git hash-object original/utilities/activations.py)" = 3e3764d985ff2f27b3eb725cae534f5a3bdb8fe0
          test "$(git hash-object t1.yml)" = 7dcc0cc0fa3b2b19e3b28eac47ab983c502b2022
          test "$(git hash-object official.hdf5)" = 6ac54600739585f54d9f612d13264b74965ffd33
      - name: Run prospective patient-disjoint original pretrained nonlinear MRI validation
        run: |
          python -m research.medical_geometry.upstream_repros.brainmask_external_annotated \
            --source-root original --config t1.yml --checkpoint official.hdf5 \
            --manifest prospective_holdout/external_subject_manifest.json \
            --output external_results/annotated_next6_frozen_validation.json \
            --expected-patients 6
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("external_results/annotated_next6_frozen_validation.json")
          d=json.loads(p.read_text())
          assert d["patient_count"] == 6
          assert d["prospective_6subject_labels_not_used_to_tune_gate"]
          assert "reliability_gated_fusion" in d["patient_macro_primary"]
          assert d["model_loaded_once_and_all_weights_frozen"]
          assert d["patient_level_unit_not_crop_level_pseudoreplication"]
          assert not d["training_or_hyperparameter_search_on_holdout"]
          assert not d["claimed_to_outperform_strong_baselines"]
          assert len(d["case_level"]) == 6
          assert all(len(case["roi_metrics"])==3 for case in d["case_level"])
          for case in d["case_level"]:
              for roi in case["roi_metrics"]:
                  assert all(
                      r["original_prediction_vs_full_residual_tail_abs_max"] <= 2e-5
                      and r["original_prediction_vs_frozen_head_abs_max"] <= 2e-5
                      for r in roi["replay_validation"]["all_real_trained_model_cut_replays"].values()
                  )
          print("PASS 6 INDEPENDENT ANNOTATED MRI SUBJECTS, fixed learned model, fixed 3 ROIs each, 7 fixed method arms, authentic source model replay")
          PY
          {
            echo "## ClinGeom next-six genuine source-ID-disjoint frozen-method replication"
            echo "Six further source-ID-disjoint T1 subjects selected at offset 8, 3 fixed 64^3 ROIs/patient (NOT full MRI). Model and gate frozen after earlier six-subject negative cohort; do not tune against either."
            echo "Method performance is not gated on success: ALL negative results are retained."
            echo '~~~json'
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("external_results/annotated_next6_frozen_validation.json").read_text())
          print(json.dumps({
              "patient_count": d["patient_count"],
              "methods": d["patient_macro_primary"],
              "paired_difference_from_native_probability": d["paired_macro_differences_vs_standard_probability"]
          }, indent=2))
          PY
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish pseudonymized metric reports (do NOT upload NIfTI scans)
        uses: actions/upload-artifact@v4
        with:
          name: ClinGeom-next6-patient-predeclared-replication-score
          path: external_results/annotated_next6_frozen_validation.json
          if-no-files-found: error
          retention-days: 60
      - name: Publish provenance-only external dataset audit (never raw MRI)
        uses: actions/upload-artifact@v4
        with:
          name: ClinGeom-next6-patient-predeclared-cohort-provenance
          path: prospective_holdout/external_subject_manifest.json
          if-no-files-found: error
          retention-days: 60
