name: P2 real 50-record aligned near-duplicate similarity audit
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p2_real_liu50_aligned_near_duplicates.py'
      - '.github/workflows/p2-real-liu50-near-duplicate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  near-duplicate-public:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MNE_DATA: /tmp/p2-near-match-public-eeg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_bspc_v13/src/p2_real_liu50_aligned_near_duplicates.py --out /tmp/p2-public-aligned-near-duplicates.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/p2-public-aligned-near-duplicates.json'))
          assert x['screened_pairs']==1225
          assert x['target_auc_never_read']
          assert x['no_cross_record_epoch_reordering_or_time_shift_test']
          print('P2_REAL_50_RECORD_ALIGNMENT_SIMILARITY_SCREEN_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-actual-liu50-1225-pair-aligned-content-similarity
          path: /tmp/p2-public-aligned-near-duplicates.json
          if-no-files-found: warn
          retention-days: 90
