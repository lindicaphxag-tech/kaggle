name: SemRepair 4 genuinely merged source defects across 2 maintainer repositories semantic false-patch corpus
on:
  pull_request:
    paths:
      - 'research/semrepair/cross_repository_semantic_repair_matrix.py'
      - 'research/semrepair/test_cross_repository_semantic_repair_matrix.py'
      - 'research/semrepair/verified_multifile_source_synthesis.py'
      - 'research/semrepair/real_merged_lerobot_4656_multifile_patch_search.py'
      - 'research/semrepair/real_merged_lerobot_action_order_regression.py'
      - 'research/semrepair/real_merged_maniskill_alias_repair.py'
      - '.github/workflows/semrepair-four-natural-merged-source-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-original-program-source-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install immutable-publisher-source torch backend for four natural defects
        run: python -m pip install "torch==2.7.1"
      - name: Run all four upstream before-after original source controls with 34 authored patch variants
        run: python -m unittest -v research.semrepair.test_cross_repository_semantic_repair_matrix
      - name: Export original source contract weak versus full repair evidence matrix
        run: python -m research.semrepair.cross_repository_semantic_repair_matrix > semrepair_4_real_merged_issues_34_program_candidates.json
      - name: Report independent-bug denominators and all semantically wrong plausible patches
        run: |
          python - <<'PY'
          import json
          x=json.load(open('semrepair_4_real_merged_issues_34_program_candidates.json'))
          print('DISTINCT_UPSTREAM_BUGS',x['independently_merged_natural_defects'])
          print('DISTINCT_PUBLISHERS',x['publisher_repository_count'])
          print('AUTHORED_PROGRAM_VARIANTS',x['authored_typed_program_variants_total'])
          for r in x['rows']:
              print('DEFECT',r['independent_upstream_issue'],
                    'SOURCE',r['actual_external_MERGED_patch'],
                    'N_PROGRAMS',r['author_generated_program_variants'],
                    'WEAK_PLAUSIBLE',r['weak_local_test_plausible'],
                    'FULL_CORRECT',r['complete_cross_boundary_contract_valid'],
                    'UNSAFE_WEAK_ACCEPT',r['weakly_accepted_but_contract_invalid'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-4-authentic-externally-merged-2publisher-34program-case-matrix
          path: semrepair_4_real_merged_issues_34_program_candidates.json
          if-no-files-found: warn
          retention-days: 90
