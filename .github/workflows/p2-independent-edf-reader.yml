name: P2 independent EDF physical-channel reader validation
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p2_independent_pyedflib_raw_check.py'
      - '.github/workflows/p2-independent-edf-reader.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  independent-raw-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MNE_DATA: /tmp/p2-public-edf-independent-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2 pyedflib
      - run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_bspc_v13/src/p2_independent_pyedflib_raw_check.py --out /tmp/p2-pyedflib-independent-raw.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/p2-pyedflib-independent-raw.json'))
          assert len(a['pairs'])==2
          assert a['not_human_identity_evidence']
          assert all(x['n_channels']>=29 and x['n_exact_equal_raw_channels']<=x['n_channels'] for x in a['pairs'])
          print("P2_PYEDFLIB_RAW_SIGNAL_READER_AUDIT_RECORDED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-raw-edf-reader-second-implementation-nonidentifying
          path: /tmp/p2-pyedflib-independent-raw.json
          if-no-files-found: warn
          retention-days: 90
