name: DefaultReg Lee2019 frozen held gate without EEG data
on:
  push:
    branches: [research/defaultreg-gid-unseen-lee2019-20261013]
    paths:
      - '.github/workflows/defaultreg-lee2019-gid-held-contract.yml'
      - 'research/defaultreg_bspc_v13/src/run_lee2019_gid_held_sha_locked.py'
      - 'research/defaultreg_bspc_v13/tests/test_lee2019_gid_held_runner_gate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-io-sha-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2 pytest
      - run: |
          python -m py_compile research/defaultreg_bspc_v13/src/run_lee2019_gid_held_sha_locked.py
          PYTHONPATH=research/defaultreg_proper_predictive python -m pytest -q research/defaultreg_bspc_v13/tests/test_lee2019_gid_held_runner_gate.py research/defaultreg_bspc_v13/tests/test_source_group_invariant_lda.py
