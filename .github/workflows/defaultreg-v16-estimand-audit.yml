name: DefaultReg V17 proper-predictive EEG comparator and journal audit
on:
  push:
    branches:
      - submission/defaultreg-v17-cpred-20261012
    paths:
      - 'research/defaultreg_bspc_v13/**'
      - 'research/defaultreg_proper_predictive/**'
      - '.github/workflows/defaultreg-v16-estimand-audit.yml'
  pull_request:
    paths:
      - 'research/defaultreg_bspc_v13/**'
      - 'research/defaultreg_proper_predictive/**'
      - '.github/workflows/defaultreg-v16-estimand-audit.yml'
permissions:
  contents: read
  actions: read

jobs:
  eeg-manuscript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical test and LaTeX dependencies
        run: |
          python -m pip install --quiet numpy scipy
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern poppler-utils
      - name: Download ORIGINAL private Kaggle frozen-score artifact by immutable ID
        run: |
          gh api repos/lindicaphxag-tech/kaggle/actions/artifacts/11674238395/zip > /tmp/defaultreg-original-shin.zip
          test -s /tmp/defaultreg-original-shin.zip
          sha256sum /tmp/defaultreg-original-shin.zip
      - name: Independently verify archived data, posthoc effects, every figure point
        working-directory: research/defaultreg_bspc_v13
        run: |
          python src/shin_v14_posthoc_robustness.py /tmp/defaultreg-original-shin.zip | tee v14_shin_original_score_audit.json
      - name: Test conditional target identifiability and exact robust Gaussian certificates
        working-directory: research/defaultreg_bspc_v13
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_conditional_transfer_identifiability.py' -v
      - name: Label-free score-order change must upper-bound archived 29-person AUC differences
        working-directory: research/defaultreg_bspc_v13
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_score_order_bridge_v15.py' -v
          python src/shin_score_order_bridge_v15.py /tmp/defaultreg-original-shin.zip --out v15_shin_score_order.json
          python -c 'import json; x=json.load(open("v15_shin_score_order.json")); assert x["n_participants"]==29 and x["all_29_auc_bounds_passed"]; assert abs(x["mean_trial_order_change_fraction"]-.13874926943308)<1e-9; print("ORIGINAL_FROZEN_SCORE_RANK_BOUND_PASS")'
      - name: Prove original covariance score NOT held-source predictive likelihood
        working-directory: research/defaultreg_bspc_v13
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_covariance_estimand_contract_v16.py' -v
          python src/covariance_estimand_contract_v16.py | tee v16_covariance_estimand_synthetic.json
          python -c 'import json; d=json.load(open("v16_covariance_estimand_synthetic.json")); assert d["class_shift_invariant_centered_score"] and d["class_shift_changes_true_predictive_score"];print("CORRECTED_ESTIMAND_CONTRACT_PASS")'
      - name: Recompute four independent cohort effects without pooled p-values
        working-directory: research/defaultreg_bspc_v13
        run: |
          python src/four_cohort_transferability_audit.py | tee v15_four_cohort_posthoc.json
          python -c 'import json; x=json.load(open("v15_four_cohort_posthoc.json")); assert x["sign_positive_datasets"]==4 and x["sign_total_datasets"]==4; assert abs(x["two_sided_sign_p_under_hypothetical_symmetric_iid_cohorts"]-.125)<1e-12; print("FOUR_COHORT_HIERARCHY_PASS")'
      - name: Check original prospective results against V15 paper
        working-directory: research/defaultreg_bspc_v13
        run: python verify_bspc_submission_claims.py --check-consistency
      - name: Compile clean V16 manuscript, crossrefs and bibliography
        working-directory: research/defaultreg_bspc_v13
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main_bspc_v16_DRAFT.tex
          test -s main_bspc_v16_DRAFT.pdf
          pdftotext main_bspc_v16_DRAFT.pdf main_bspc_v16_DRAFT.txt
          grep -q "Regularisation Objective Mismatch" main_bspc_v16_DRAFT.txt
          grep -q "source objective separation" main_bspc_v16_DRAFT.txt
          echo 'V16_PDF_AND_COVARIANCE_ESTIMAND_TESTS_PASSED'
          pdfinfo main_bspc_v16_DRAFT.pdf | grep Pages
      - uses: actions/upload-artifact@v4
        with:
          name: defaultreg-v16-estimand-corrected-review-pdf
          path: |
            research/defaultreg_bspc_v13/main_bspc_v16_DRAFT.pdf
            research/defaultreg_bspc_v13/main_bspc_v16_DRAFT.log
            research/defaultreg_bspc_v13/main_bspc_v16_DRAFT.bbl
            research/defaultreg_bspc_v13/v14_shin_original_score_audit.json
            research/defaultreg_bspc_v13/v15_four_cohort_posthoc.json
            research/defaultreg_bspc_v13/v16_covariance_estimand_synthetic.json
            research/defaultreg_bspc_v13/v15_shin_score_order.json
            research/defaultreg_bspc_v13/SOURCE_MIRROR.json
          retention-days: 90
  true-predictive-source-only-shin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
      MNE_DATA: ${{ runner.temp }}/mne_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact previous EEG analysis dependency family
        run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Validate source-only experiment code
        run: |
          python -m py_compile research/defaultreg_proper_predictive/original_frozen_runner.py
          python -m py_compile research/defaultreg_proper_predictive/run_proper_predictive_posthoc.py
      - name: Source-only synthetic original tangent-stack smoke
        run: |
          cd research/defaultreg_proper_predictive
          python -m unittest -v test_proper_predictive_source_only
      - name: Download immutable ORIGINAL frozen Shin score family
        run: |
          gh api repos/lindicaphxag-tech/kaggle/actions/artifacts/11674238395/zip > /tmp/defaultreg-Shin-original.zip
          echo cda3210d24a8e9c7f3bf2d48490e51ad51f023beb652816a8679088cc3fb1842'  /tmp/defaultreg-Shin-original.zip' | sha256sum -c
      - name: Execute actual source-only proper predictive NLL selection on public Shin2017A EEG
        run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_proper_predictive/run_proper_predictive_posthoc.py \
            --original-zip /tmp/defaultreg-Shin-original.zip \
            --out /tmp/defaultreg-v16-proper-predictive
      - name: Validate 29-source-selection receipts and non-confirmatory scope
        run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('/tmp/defaultreg-v16-proper-predictive')
          s=json.loads((d/'SOURCE_CHOICES_FROZEN_BEFORE_TARGET_OUTCOME_JOIN.json').read_text())
          x=json.loads((d/'POSTHOC_PROPER_PREDICTIVE_VS_FROZEN_RESULTS.json').read_text())
          assert len(s)==x['n']==29
          assert all(q['no_outer_target_info_for_selection'] for q in s)
          assert x['no_new_confirmatory_p_value'] is True
          assert x['status']=='POST_OUTCOME_REAL_EEG_SENSITIVITY_NOT_CONFIRMATORY'
          print('PASS_29_SOURCE_ONLY_PROPER_PREDICTIVE_REAL_EEG_POSTHOC',x['mean_source_macro_minus_proper_AUC'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v16-real-source-mean-predictive-posthoc-NOT-confirmatory
          path: |
            /tmp/defaultreg-v16-proper-predictive/**
            research/defaultreg_proper_predictive/original_frozen_runner.py
            research/defaultreg_proper_predictive/run_proper_predictive_posthoc.py
          if-no-files-found: warn
          retention-days: 90
