name: DefaultReg v5 predata panel

on:
  push:
    branches:
      - research/defaultreg-v5-predatapanel-20261010
    paths:
      - 'research/defaultreg_v5/**'
      - '.github/workflows/defaultreg-v5-predata-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bnci2014-002:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: ${{ runner.temp }}/mne_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen stack
        run: python -m pip install --disable-pip-version-check moabb==1.7.2 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 mne==1.11.0 pyriemann==0.12
      - name: Verify environment
        run: python -c "import moabb,numpy,sklearn,mne,pyriemann; assert moabb.__version__=='1.7.2'; assert numpy.__version__=='2.3.5'; assert sklearn.__version__=='1.8.0'; assert mne.__version__=='1.11.0'; assert pyriemann.__version__=='0.12'"
      - name: Compile
        run: python -m py_compile research/defaultreg_v5/run_v5_predata_panel.py research/defaultreg_v5/audit_v5_result.py
      - name: Execute BNCI2014_002
        run: python research/defaultreg_v5/run_v5_predata_panel.py --dataset BNCI2014_002 --data-root "$MNE_DATA" --out defaultreg_v5_BNCI2014_002
      - name: Audit BNCI2014_002
        run: python research/defaultreg_v5/audit_v5_result.py --dataset BNCI2014_002 --root defaultreg_v5_BNCI2014_002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v5-BNCI2014_002
          path: |
            research/defaultreg_v5/FROZEN_PREDATA_BNCI_PANEL_20261010.md
            defaultreg_v5_BNCI2014_002/**
          if-no-files-found: warn
          retention-days: 90

  bnci2015-001:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: ${{ runner.temp }}/mne_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen stack
        run: python -m pip install --disable-pip-version-check moabb==1.7.2 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 mne==1.11.0 pyriemann==0.12
      - name: Verify environment
        run: python -c "import moabb,numpy,sklearn,mne,pyriemann; assert moabb.__version__=='1.7.2'; assert numpy.__version__=='2.3.5'; assert sklearn.__version__=='1.8.0'; assert mne.__version__=='1.11.0'; assert pyriemann.__version__=='0.12'"
      - name: Compile
        run: python -m py_compile research/defaultreg_v5/run_v5_predata_panel.py research/defaultreg_v5/audit_v5_result.py
      - name: Execute BNCI2015_001
        run: python research/defaultreg_v5/run_v5_predata_panel.py --dataset BNCI2015_001 --data-root "$MNE_DATA" --out defaultreg_v5_BNCI2015_001
      - name: Audit BNCI2015_001
        run: python research/defaultreg_v5/audit_v5_result.py --dataset BNCI2015_001 --root defaultreg_v5_BNCI2015_001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v5-BNCI2015_001
          path: |
            research/defaultreg_v5/FROZEN_PREDATA_BNCI_PANEL_20261010.md
            defaultreg_v5_BNCI2015_001/**
          if-no-files-found: warn
          retention-days: 90
