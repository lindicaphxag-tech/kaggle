name: P2 real Liu49 two-classifier fixed-fit sensitivity
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p2_real_model_family_sensitivity.py'
      - '.github/workflows/p2-real-multimodel-record-purge.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  actual-eeg-model-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: /tmp/p2-real-source-eeg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original public EEG dependencies
        run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Validate and run TWO fixed algorithm families on SAME 49 released content-groups
        run: |
          python -m py_compile research/defaultreg_bspc_v13/src/p2_real_model_family_sensitivity.py
          mkdir -p "$MNE_DATA" /tmp/p2-new-retro-models
          python research/defaultreg_bspc_v13/src/p2_real_model_family_sensitivity.py --out /tmp/p2-new-retro-models/paired_49_model_family_results.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/p2-new-retro-models/paired_49_model_family_results.json'))
          assert d['n_held_content_groups']==49
          assert d['not_strict_Z0_due_global_signal_identity_discovery']
          assert set(d['summary'])=={'logistic_C1','ridge_alpha10'}
          assert len({r['record_group'] for r in d['rows']})==49
          for s in d['summary'].values():
              assert -.5 <= s['all49_mean_change'] <= .5
          print("P2_REAL_RETROSPECTIVE_TWO_CLASSIFIERS_CHECKED_NO_CAUSAL_CLAIM")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-real-49-retrospective-tangent-logistic-ridge-sensitivity
          path: /tmp/p2-new-retro-models/*.json
          if-no-files-found: warn
          retention-days: 90
