name: SemRepair ClinGeom independent evidence gates
on:
  pull_request:
    paths:
      - 'research/semrepair/blind_authority_runner.py'
      - 'research/semrepair/test_blind_authority_runner.py'
      - 'research/semrepair/bound_repair_authority.py'
      - 'research/semrepair/test_bound_repair_authority.py'
      - 'research/medical_geometry/patient_evidence_audit.py'
      - 'research/medical_geometry/test_patient_evidence_audit.py'
      - '.github/workflows/semrepair-clingeom-independent-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Hidden-world authority refusal tests
        run: python -m unittest discover -v -s research/semrepair -p test_blind_authority_runner.py
      - name: Digest-bound repair authorization and refusal
        run: python -m unittest discover -v -s research/semrepair -p test_bound_repair_authority.py
      - name: Patient-level medical geometry audit tests
        run: python -m unittest discover -v -s research/medical_geometry -p test_patient_evidence_audit.py
