name: DefaultReg V27 exact partial EEG-epoch overlap scan
on:
  push:
    branches:
      - research/defaultreg-v27-epoch-overlap-integrity-20261013
    paths:
      - 'research/defaultreg_bspc_v13/src/exact_epoch_identity_v27.py'
      - 'research/defaultreg_bspc_v13/src/run_liu2024_epoch_overlap_v27.py'
      - 'research/defaultreg_bspc_v13/tests/test_exact_epoch_identity_v27.py'
      - '.github/workflows/defaultreg-v27-epoch-overlap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-algorithm-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy
      - name: Verify partial, transitive and label-inconsistent trial reuse
        run: |
          python -m unittest discover -v -s research/defaultreg_bspc_v13/tests -p 'test_exact_epoch_identity_v27.py'
          python -m py_compile research/defaultreg_bspc_v13/src/exact_epoch_identity_v27.py research/defaultreg_bspc_v13/src/run_liu2024_epoch_overlap_v27.py
  entire-public-2000-trial-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: /tmp/defaultreg-v27-epoch-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original EEG dataset pipeline
        run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Run full preprocessed epoch equality ledger with no performance reads
        run: |
          mkdir -p "$MNE_DATA" /tmp/defaultreg-v27
          python research/defaultreg_bspc_v13/src/run_liu2024_epoch_overlap_v27.py --out /tmp/defaultreg-v27/LIU2024_ALL2000_EPOCH_OVERLAP_REPORT.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/defaultreg-v27/LIU2024_ALL2000_EPOCH_OVERLAP_REPORT.json')
          r=json.loads(p.read_text())
          assert r['status']=='V27_RETROSPECTIVE_EXACT_EEG_EPOCH_IDENTITY_COMPLETE'
          assert r['n_original_subject_ids']==50 and r['n_total_trial_instances']==2000
          assert r['epoch_shape_channels_samples'][0]==29
          assert r['not_prospective_or_strict_Z0']
          assert r['global_EEG_content_access_for_grouping']
          assert all(1<=sid<=50 for x in r['exact_epoch_connected_components'] for sid in x)
          assert sum(len(x) for x in r['exact_epoch_connected_components'])==50
          assert r['n_exact_epoch_connected_groups']<=49
          assert any(4 in x and 5 in x for x in r['exact_epoch_connected_components'])
          print('PASS_V27_ALL_2K_REAL_EEG_EPOCH_OVERLAP_SAFETY_AUDIT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v27-2000-public-EEG-epoch-overlap-integrity
          path: /tmp/defaultreg-v27/**
          if-no-files-found: warn
          retention-days: 90
