name: DefaultReg V15 source-target identifiability and EEG PDF
on:
  push:
    branches:
      - submission/defaultreg-v15-root-validity-20261011
    paths:
      - 'research/defaultreg_bspc_v13/**'
      - '.github/workflows/defaultreg-v15-root-validity.yml'
  pull_request:
    paths:
      - 'research/defaultreg_bspc_v13/**'
      - '.github/workflows/defaultreg-v15-root-validity.yml'
permissions:
  contents: read
  actions: read

jobs:
  eeg-manuscript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical test and LaTeX dependencies
        run: |
          python -m pip install --quiet numpy scipy
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern poppler-utils
      - name: Download ORIGINAL private Kaggle frozen-score artifact by immutable ID
        run: |
          gh api repos/lindicaphxag-tech/kaggle/actions/artifacts/11674238395/zip > /tmp/defaultreg-original-shin.zip
          test -s /tmp/defaultreg-original-shin.zip
          sha256sum /tmp/defaultreg-original-shin.zip
      - name: Independently verify archived data, posthoc effects, every figure point
        working-directory: research/defaultreg_bspc_v13
        run: |
          python src/shin_v14_posthoc_robustness.py /tmp/defaultreg-original-shin.zip | tee v14_shin_original_score_audit.json
      - name: Test conditional target identifiability and exact robust Gaussian certificates
        working-directory: research/defaultreg_bspc_v13
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_conditional_transfer_identifiability.py' -v
      - name: Recompute four independent cohort effects without pooled p-values
        working-directory: research/defaultreg_bspc_v13
        run: |
          python src/four_cohort_transferability_audit.py | tee v15_four_cohort_posthoc.json
          python -c 'import json; x=json.load(open("v15_four_cohort_posthoc.json")); assert x["sign_positive_datasets"]==4 and x["sign_total_datasets"]==4; assert abs(x["two_sided_sign_p_under_hypothetical_symmetric_iid_cohorts"]-.125)<1e-12; print("FOUR_COHORT_HIERARCHY_PASS")'
      - name: Check original prospective results against V15 paper
        working-directory: research/defaultreg_bspc_v13
        run: python verify_bspc_submission_claims.py --check-consistency
      - name: Compile clean V15 manuscript, crossrefs and bibliography
        working-directory: research/defaultreg_bspc_v13
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main_bspc_v15_DRAFT.tex
          test -s main_bspc_v15_DRAFT.pdf
          pdftotext main_bspc_v15_DRAFT.pdf main_bspc_v15_DRAFT.txt
          grep -q "Regularisation Objective Mismatch" main_bspc_v15_DRAFT.txt
          grep -q "source objective separation" main_bspc_v15_DRAFT.txt
          echo 'V15_PDF_AND_IDENTIFIABILITY_TESTS_PASSED'
          pdfinfo main_bspc_v15_DRAFT.pdf | grep Pages
      - uses: actions/upload-artifact@v4
        with:
          name: defaultreg-v15-evidence-theory-verified-review-pdf
          path: |
            research/defaultreg_bspc_v13/main_bspc_v15_DRAFT.pdf
            research/defaultreg_bspc_v13/main_bspc_v15_DRAFT.log
            research/defaultreg_bspc_v13/main_bspc_v15_DRAFT.bbl
            research/defaultreg_bspc_v13/v14_shin_original_score_audit.json
            research/defaultreg_bspc_v13/v15_four_cohort_posthoc.json
            research/defaultreg_bspc_v13/SOURCE_MIRROR.json
          retention-days: 90
