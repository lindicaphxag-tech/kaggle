name: P3 new BNCI2014-004 real common selector matrix
on:
  push:
    branches: [publication/default-eeg-p3-transfer-negative-20261013]
    paths:
      - 'research/defaultreg_bspc_v13/src/p3_new_bnci004_common_matrix.py'
      - '.github/workflows/p3-real-bnci004-common-matrix.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run-fixed-source-only-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      MNE_DATA: /tmp/p3-new-bnci004-eeg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Load 8 source IDs, SHA-lock selections BEFORE any held ID9 EEG, then run shared 9-fold exploratory
        run: |
          mkdir -p "$MNE_DATA" /tmp/p3-real-bnci004-shared
          python -m py_compile research/defaultreg_bspc_v13/src/p3_new_bnci004_common_matrix.py
          python research/defaultreg_bspc_v13/src/p3_new_bnci004_common_matrix.py --out /tmp/p3-real-bnci004-shared
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('/tmp/p3-real-bnci004-shared')
          s=d/'BEFORE_SUBJECT9_SIGNAL_SOURCE_ONLY_CHOICES.json'
          z=json.loads((d/'P3_ACTUAL_BNCI004_SHARED_MATRIX_RESULTS.json').read_text())
          assert z['reserved_subject9_source_sha']==hashlib.sha256(s.read_bytes()).hexdigest()
          assert z['one_held_subject_primary_not_a_confirmatory_cohort']['independent_targets_in_this_locked_experiment']==1
          assert len(z['all9_held_people_EXPLORATORY_not_independent'])==9
          assert all(0<=v['AUC']['source_macro']<=1 for v in z['all9_held_people_EXPLORATORY_not_independent'])
          print('P3_REAL_BNCI004_SHARED_MATRIX_DONE_WITH_EXPLORATORY_LABEL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-new-real-bnci004-source-lock-plus-shared-nine-fold
          path: /tmp/p3-real-bnci004-shared/*.json
          if-no-files-found: warn
          retention-days: 90
