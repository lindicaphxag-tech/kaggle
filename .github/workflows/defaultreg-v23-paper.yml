name: DefaultReg V23 compiled research paper and source-optimality test
on:
  push:
    branches:
      - research/defaultreg-v23-certified-spectral-path-20261013
    paths:
      - '.github/workflows/defaultreg-v23-paper.yml'
      - 'research/defaultreg_bspc_v13/main_bspc_v23_SPECTRAL_DRAFT.tex'
      - 'research/defaultreg_bspc_v13/111_v23_spectral_rank_certificate.tex'
      - 'research/defaultreg_bspc_v13/112_v23_continuous_optimisation.tex'
      - 'research/defaultreg_bspc_v13/113_v23_source_search_result.tex'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v23-article:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TeX and unit test dependencies
        run: |
          python -m pip install --quiet numpy
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern poppler-utils
      - name: Verify new optimisation and source rank mechanisms
        run: |
          python -m unittest discover -v -s research/defaultreg_bspc_v13/tests -p 'test_spectral_path_certificate_v23.py'
          python -m unittest discover -v -s research/defaultreg_bspc_v13/tests -p 'test_certified_continuous_selector_v23.py'
          python -m unittest discover -v -s research/defaultreg_bspc_v13/tests -p 'test_source_rank_churn_v22.py'
      - name: Compile V23 source-only certified path manuscript
        working-directory: research/defaultreg_bspc_v13
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main_bspc_v23_SPECTRAL_DRAFT.tex
          test -s main_bspc_v23_SPECTRAL_DRAFT.pdf
          pdftotext main_bspc_v23_SPECTRAL_DRAFT.pdf main_bspc_v23.txt
          grep -q '0.02680' main_bspc_v23.txt
          if grep -Eq 'Undefined control sequence|Citation.*undefined|multiply defined' main_bspc_v23_SPECTRAL_DRAFT.log; then exit 3; fi
          pdfinfo main_bspc_v23_SPECTRAL_DRAFT.pdf | grep Pages
      - uses: actions/upload-artifact@v4
        with:
          name: defaultreg-v23-spectral-continuum-eeg-research-draft-PDF
          path: |
            research/defaultreg_bspc_v13/main_bspc_v23_SPECTRAL_DRAFT.pdf
            research/defaultreg_bspc_v13/main_bspc_v23_SPECTRAL_DRAFT.log
            research/defaultreg_bspc_v13/V23_SPECTRAL_CERTIFICATE_PREOUTCOME_PROTOCOL.md
