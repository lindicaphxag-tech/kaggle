name: P2 ProvGuard V3 six-EDF held-source benchmark
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-provenance-v3-real-edf-20261015.yml'
      - 'research/defaultreg_bspc_v13/src/p2_provguard_v3_frozen.py'
      - 'research/defaultreg_bspc_v13/src/p2_provguard_v3_chbmit_benchmark.py'
  push:
    branches:
      - publication/default-eeg-p2-record-identity-20261013
    paths:
      - '.github/workflows/p2-provenance-v3-real-edf-20261015.yml'
      - 'research/defaultreg_bspc_v13/src/p2_provguard_v3_frozen.py'
      - 'research/defaultreg_bspc_v13/src/p2_provguard_v3_chbmit_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p2_v3_real_edf:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical deps
        run: python -m pip install 'numpy<3' 'scipy<2'
      - name: Real EDF frozen six-source benchmark
        env:
          P2_OUTPUT: p2_v3_chbmit_results
        run: python research/defaultreg_bspc_v13/src/p2_provguard_v3_chbmit_benchmark.py
      - name: Upload immutable case-level receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-provguard-v3-real-chbmit-cases
          path: p2_v3_chbmit_results/
          if-no-files-found: warn
