name: P1 actual EEG MNE topography figure (context only)
on:
  push:
    paths:
      - 'research/defaultreg_bspc_v13/src/p1_real_eeg_publisher_topomap.py'
      - '.github/workflows/p1-real-eeg-publisher-topomap.yml'
  pull_request:
    paths:
      - 'research/defaultreg_bspc_v13/src/p1_real_eeg_publisher_topomap.py'
      - '.github/workflows/p1-real-eeg-publisher-topomap.yml'
permissions:
  contents: read
jobs:
  genuine-scalp-bandpower:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FIGURE_OUT: /tmp/p1-actual-topomap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public EEG dependencies
        run: python -m pip install --disable-pip-version-check moabb==1.7.2 matplotlib scipy
      - name: Produce real BNCI subject scalp maps
        run: python research/defaultreg_bspc_v13/src/p1_real_eeg_publisher_topomap.py
      - name: Inspect provenance and prohibit estimator-map mislabelling
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/p1-actual-topomap/provenance.json'))
          assert d['status']=='REAL_EEG_CONTEXT_ONLY'
          assert d['not_decoding_weights'] and d['not_unseen_subject']
          for suffix in ['.pdf','.png']:
              path='/tmp/p1-actual-topomap/P1_actual_BNCI_subject1_bandpower_topomap'+suffix
              assert os.path.getsize(path)>10000
          print('PASS_REAL_MNE_CONTEXT_ONLY',d['shape'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P1-real-public-EEG-scalp-bandpower-context-only
          path: /tmp/p1-actual-topomap/
          if-no-files-found: warn
          retention-days: 90
