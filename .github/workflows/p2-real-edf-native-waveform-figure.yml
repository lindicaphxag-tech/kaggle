name: P2 real EDF waveform figure SHA-gated
on:
  push:
    paths:
      - 'research/defaultreg_bspc_v13/src/p2_real_edf_native_waveform_panel.py'
      - '.github/workflows/p2-real-edf-native-waveform-figure.yml'
  pull_request:
    paths:
      - 'research/defaultreg_bspc_v13/src/p2_real_edf_native_waveform_panel.py'
      - '.github/workflows/p2-real-edf-native-waveform-figure.yml'
permissions:
  contents: read
jobs:
  real-EDF-waveforms:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      FIGURE_OUT: /tmp/p2-native-real-waves
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Draw authentic native digital waveforms only after full SHA checks
        run: python research/defaultreg_bspc_v13/src/p2_real_edf_native_waveform_panel.py
      - name: Scope audit of the actual rendered data
        run: |
          python - <<'PY'
          import json,os
          p='/tmp/p2-native-real-waves/'
          d=json.load(open(p+'provenance.json'))
          assert d['status']=='REAL_PUBLIC_EDF_WAVEFORMS_SHA_VERIFIED'
          assert d['patient_identity_not_assessed']
          assert d['not_original_raw_MAT']
          assert all(os.path.getsize(p+'P2_real_native_EDF_waveform_array'+s)>10000 for s in ('.pdf','.png'))
          print('PASS_PUBLIC_SHA_VERIFIED_NATIVE_WAVEFORMS',d['cases'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P2-real-EDF-native-waveform-panels-SHA-gated
          path: /tmp/p2-native-real-waves/
          if-no-files-found: warn
          retention-days: 90
