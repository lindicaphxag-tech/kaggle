name: P2 exact public EDF contiguous digital overlap topology
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths:
      - '.github/workflows/p2-nemar-three-pair-temporal-overlap-topology.yml'
      - 'research/defaultreg_bspc_v13/src/p2_nemar_3_pair_exact_temporal_block_topology.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  six_real_public_EDFs_three_block_topologies:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: No-network synthetic contiguous-span boundary controls
        run: |
          python research/defaultreg_bspc_v13/src/p2_nemar_3_pair_exact_temporal_block_topology.py --self-test
      - name: Check full public EDF SHA and derive exact storage-block temporal topology
        run: |
          python research/defaultreg_bspc_v13/src/p2_nemar_3_pair_exact_temporal_block_topology.py --out p2_nemar_temporal_native_block_topology.json
      - name: Require correct known full-cohort block counts and no clinical-identity claims
        run: |
          python - <<'PY'
          import json
          x=json.load(open('p2_nemar_temporal_native_block_topology.json'))
          assert x['status']=='PUBLIC_EDF_DIGITAL_BLOCK_OVERLAP_CONTIGUOUS_SPANS_REAL'
          assert x['full_binary_SHA256_recomputed_and_confirmed_6_files']
          assert [p['released_public_ID_pair'] for p in x['pairs']]==[[4,5],[11,15],[47,49]]
          assert [p['total_aligned_exact_EEG_storage_blocks'] for p in x['pairs']]==[9280,171,6957]
          assert x['no_patient_or_raw_MAT_lineage_identity_inference']
          assert x['published_EDF_native_storage_block_not_trial']
          print('P2_REAL_SIX_EDF_NATIVE_TEMPORAL_CONTIGUOUS_BLOCK_TOPOLOGY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-real-six-EDF-native-temporal-block-overlap-and-span-receipt
          path: p2_nemar_temporal_native_block_topology.json
          retention-days: 90
