name: P2 V8 matched-subset projection regression
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-v8-matched-projection-proof.yml'
      - 'research/defaultreg_bspc_v13/src/p2_v8_projection_equivariance_regression.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projection_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy<3'
      - name: Test exact projection invariance and constructed controls
        run: python research/defaultreg_bspc_v13/src/p2_v8_projection_equivariance_regression.py
