name: SemRepair genuine LeRobot premerge-only cross-file synthesis
on:
  pull_request:
    paths:
      - 'research/semrepair/lerobot_crossfile_finite_synth.py'
      - 'research/semrepair/test_lerobot_crossfile_finite_synth.py'
      - 'research/semrepair/real_merged_lerobot_processor_contract.py'
      - '.github/workflows/semrepair-lerobot-crossfile-synth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-crossfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independently execute pinned source and falsifiers
        run: python -m unittest -v research.semrepair.test_lerobot_crossfile_finite_synth
      - name: Record complete finite search and exact source identities
        run: |
          python -m research.semrepair.lerobot_crossfile_finite_synth > lerobot_crossfile_synth_evidence.json
          python - <<'PY'
          import json
          d=json.load(open('lerobot_crossfile_synth_evidence.json'))
          assert d["candidate_count"]==16
          assert d["grammar_minimum_declared_cost"]==5
          assert d["scope_refusal_verified"]
          assert d["minimality_verified_by_exhaustive_lower_budget_refusal"]
          assert all(x[0] for x in d["scenario_results"].values())
          assert not d["actual_pretrained_policy_executed"]
          print('PREMERGE-ONLY conditional cross-file result; NOT universal APR',d['chosen_candidate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-premerge-crossfile-${{ matrix.python }}
          path: lerobot_crossfile_synth_evidence.json
          if-no-files-found: warn
          retention-days: 90
