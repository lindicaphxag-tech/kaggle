name: DefaultReg V32 Dreyer original SHA transport-only resumed
on:
  push:
    branches: [research/defaultreg-v32-noise-debiased-contrast-20261013]
    paths: ['.github/workflows/defaultreg-v32-dreyer-transport-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducible-resumed-target:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MNE_DATA: /tmp/defaultreg-v32-retry-dreyer-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Unchanged source model dependency family
        run: python -m pip install --disable-pip-version-check moabb==1.7.2 pytest
      - name: Confirm unchanged scientific tests
        run: |
          PYTHONPATH=research/defaultreg_proper_predictive python -m pytest -q research/defaultreg_bspc_v13/tests/test_noise_debiased_subject_operator_v32.py
          python -m py_compile research/defaultreg_bspc_v13/src/run_v32_transport_identical_sha_resume.py
      - name: Reproduce ORIGINAL 12-source SHA, only then fetch all 12 held targets
        run: |
          mkdir -p "$MNE_DATA" /tmp/defaultreg-v32-retry-result
          python research/defaultreg_bspc_v13/src/run_v32_transport_identical_sha_resume.py --out /tmp/defaultreg-v32-retry-result
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/defaultreg-v32-retry-result')
          a=root/'V32_DREYER_SOURCE_CHOICES_LOCKED_BEFORE_TARGET.json'
          b=root/'V32_DREYER_NEW_ACQUISITION_ALL_HELD_RESULTS.json'
          s=json.loads(a.read_text());t=json.loads(b.read_text())
          exact='9bfc60e1da10575315917aa6662532198a892dfa99f045341bb71adde58a04b9'
          assert hashlib.sha256(a.read_bytes()).hexdigest()==exact==t['source_choices_sha256']
          assert s['source_ids']==list(range(1,13))
          assert s['target_ids_unread']==list(range(13,25))
          assert len(t['all_held_person_outcomes'])==12
          assert set(q['subject'] for q in t['all_held_person_outcomes'])==set(range(13,25))
          assert t['n_source_participants']==t['n_held_participants']==12
          assert 'riemannian_MDM' in t['macro_auc_by_method']
          assert 'tangent_LogReg' in t['macro_auc_by_method']
          assert len(t['macro_auc_by_method'])>=9
          print('V32_DREYER_ALL12_SOURCE_SHA_REPRODUCED_RESULTS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v32-Dreyer-retry-exact-source-sha-all-held
          path: |
            /tmp/defaultreg-v32-retry-result/**
            research/defaultreg_bspc_v13/V32_DREYER_STRICT_SOURCE_ONLY_FIRST_RUN_PROTOCOL.md
            research/defaultreg_bspc_v13/V32_OSF_DOWNLOAD_RESUMPTION_PROVENANCE.md
          if-no-files-found: warn
          retention-days: 90
