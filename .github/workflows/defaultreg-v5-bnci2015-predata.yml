name: DefaultReg v5 BNCI2015 TRUE PRE-DATA execution

on:
  push:
    branches:
      - research/defaultreg-v5-predatapanel-20261010
    paths:
      - '.github/workflows/defaultreg-v5-bnci2015-predata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-bnci2015:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed if frozen scientific assets changed after BNCI002
        run: |
          test "$(git hash-object research/defaultreg_v5/run_v5_predata_panel.py)" = "08867a6ac2157a24b25cad66d050ac4ec1870fb7"
          test "$(git hash-object research/defaultreg_v5/audit_v5_result.py)" = "dbb5cd323e10a477750c04a11be06b5c1a845be0"
          test "$(git hash-object research/defaultreg_v5/FROZEN_PREDATA_BNCI_PANEL_20261010.md)" = "4e6c3882c4de84f543351a19dfb6ac0b9a29e2b6"
          echo "PASS_FROZEN_V5_ASSET_IDENTITY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install identical frozen stack
        run: python -m pip install --disable-pip-version-check moabb==1.7.2 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 mne==1.11.0 pyriemann==0.12
      - name: Verify environment
        run: python -c "import moabb,numpy,sklearn,mne,pyriemann; assert moabb.__version__=='1.7.2'; assert numpy.__version__=='2.3.5'; assert sklearn.__version__=='1.8.0'; assert mne.__version__=='1.11.0'; assert pyriemann.__version__=='0.12'"
      - name: Compile unchanged frozen v5 runner
        run: python -m py_compile research/defaultreg_v5/run_v5_predata_panel.py research/defaultreg_v5/audit_v5_result.py
      - name: Execute BNCI2015_001 with unchanged TRUE PRE-DATA protocol
        run: |
          mkdir -p "$RUNNER_TEMP/mne_data"
          python research/defaultreg_v5/run_v5_predata_panel.py \
            --dataset BNCI2015_001 \
            --data-root "$RUNNER_TEMP/mne_data" \
            --out "$GITHUB_WORKSPACE/defaultreg_v5_BNCI2015_001"
      - name: Audit BNCI2015_001
        run: python research/defaultreg_v5/audit_v5_result.py --dataset BNCI2015_001 --root defaultreg_v5_BNCI2015_001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defaultreg-v5-BNCI2015_001
          path: |
            research/defaultreg_v5/FROZEN_PREDATA_BNCI_PANEL_20261010.md
            defaultreg_v5_BNCI2015_001/**
          if-no-files-found: warn
          retention-days: 90
