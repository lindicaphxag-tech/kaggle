name: PCPR source-anchored native evidence
on:
  push:
    paths:
      - "research/pcpr/**"
      - ".github/workflows/pcpr-source-anchored-native.yml"
  pull_request:
    paths:
      - "research/pcpr/**"
      - ".github/workflows/pcpr-source-anchored-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anchored-deepchem:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only official PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run adversarial source-scope regression tests
        run: |
          PYTHONPATH=research/pcpr python -m unittest discover -s research/pcpr -p 'test_*.py' -v
          PYTHONPATH=research/pcpr python -O -m unittest discover -s research/pcpr -p 'test_*.py' -q
      - name: Run fail-closed causal evidence closure reference example
        run: python research/pcpr/causal_evidence_closure.py
      - name: Verify original Git blobs and execute native PyTorch field witnesses
        run: python research/pcpr/run_real_deepchem_source.py
      - name: Run the six frozen transfer PRs (first score, source candidates ONLY)
        run: python research/pcpr/patch_scope_vnext.py
      - name: Run post-hoc typed-effect development (NOT prospective)
        run: python research/pcpr/typed_effects_v02.py
      - name: Run unseen eight repos with pre-frozen v0.2 detector
        run: python research/pcpr/run_v02_unseen_eight.py
      - name: Install Kornia import dependencies
        run: python -m pip install kornia-rs numpy packaging
      - name: Run pinned Kornia native package before/after source
        run: python research/pcpr/run_native_kornia_5446.py
      - name: Run pinned Kornia So2 native package broadcast before/after source
        run: python research/pcpr/run_native_kornia_5005.py
      - name: Run finite-state adaptive proof-scope planner (synthetic only)
        run: python research/pcpr/adaptive_scope_planner.py
      - name: Run SHA-pinned original-source AST function-level replays
        run: python research/pcpr/native_ast_lift_v03.py
      - name: Run real-source CEC receipt attachment (previously inspected cases)
        run: python research/pcpr/attach_real_cec_receipts.py
      - name: Run pre-inspection v0.5 typed AST transfer (hypotheses only)
        run: python research/pcpr/run_v05_unseen_eight.py
      - name: Run v0.5 authenticated transport retry after original eight fetch failures
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/pcpr/run_v05_authenticated_retry.py
      - name: Run generic AST single-edit native counterfactuals (development only)
        run: python research/pcpr/run_v06_native_counterfactuals.py
      - name: Run pinned MONAI loss dtype native counterfactual (development only)
        run: python research/pcpr/run_native_monai_9103.py
      - name: First-score 48 untouched PRs across 47 repositories (native operator only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/pcpr/run_v07_frozen_48_pr.py
      - name: First-score 64 untouched PRs with v0.8 native symbolic source interpreter
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/pcpr/run_v08_new_64_holdout.py
      - name: Run SHA-pinned spikingjelly symbolic native development case
        run: python research/pcpr/run_v08_spikingjelly_pinned_dev.py
      - name: Run SHA-pinned TorchJD cross-expression native development case
        run: python research/pcpr/run_v09_torchjd_original_dev.py
      - name: First-score third 32-PR holdout (v0.9 source-exact cast expressions)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/pcpr/run_v09_new_32_holdout.py
      - name: Diagnose and transport-retry same v0.9 32-PR cohort
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/pcpr/run_v09_auth_transport_retry.py
      - name: Replay authentic prepatch unchanged-test contract (Kornia #5358)
        run: python research/pcpr/run_prepatch_kornia_5358_contracts.py
      - name: Preserve case-level source provenance
        uses: actions/upload-artifact@v4
        with:
          name: pcpr-deepchem-original-operator-audit
          path: |
            pcpr_deepchem_native_summary.json
            pcpr_vnext_frozen_first_score.json
            pcpr_v02_posthoc_effects.json
            pcpr_v02_unseen_eight_first_score.json
            pcpr_minimax_synthetic.json
            pcpr_v03_original_source_native.json
            pcpr_v04_cec_real_source_receipts.json
            pcpr_v05_unseen_eight_first_score.json
            pcpr_v05_eight_auth_transport_retry.json
            pcpr_v06_native_single_edit_counterfactuals.json
            pcpr_monai_9103_native_counterfactual.json
            pcpr_v07_48_pr_frozen_native_first_score.json
            pcpr_v08_new_64_frozen_first_score.json
            pcpr_v08_spikingjelly_pinned_dev.json
            pcpr_v09_torchjd_821_original_source.json
            pcpr_v09_new_32_frozen_first_score.json
            pcpr_v09_auth_transport_retry_after_32_http_errors.json
            pcpr_kornia_native_package_evidence.json
            pcpr_kornia_so2_native.json
            pcpr_prepatch_kornia_5358_contracts.json
          if-no-files-found: error
