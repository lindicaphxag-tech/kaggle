name: PCPR source-anchored native evidence
on:
  push:
    paths:
      - "research/pcpr/**"
      - ".github/workflows/pcpr-source-anchored-native.yml"
  pull_request:
    paths:
      - "research/pcpr/**"
      - ".github/workflows/pcpr-source-anchored-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anchored-deepchem:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only official PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run adversarial source-scope regression tests
        run: |
          python -m unittest -v research/pcpr/test_pcpr_source_closure.py
          python -O -m unittest -q research/pcpr/test_pcpr_source_closure.py
      - name: Verify original Git blobs and execute native PyTorch field witnesses
        run: python research/pcpr/run_real_deepchem_source.py
      - name: Preserve case-level source provenance
        uses: actions/upload-artifact@v4
        with:
          name: pcpr-deepchem-original-operator-audit
          path: pcpr_deepchem_native_summary.json
          if-no-files-found: error
