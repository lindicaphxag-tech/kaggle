name: SemRepair authentic official ManiSkill controller sign bug and equal-info oracle
on:
  pull_request:
    paths:
      - 'research/semrepair/maniskill_upstream_rotation_sign_case.py'
      - 'research/semrepair/test_maniskill_upstream_rotation_sign_case.py'
      - '.github/workflows/semrepair-real-maniskill-sign-bug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-mani-skill-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch for unchanged real ManiSkill controller and utility functions
        run: python -m pip install "torch==2.7.1"
      - name: Verify publisher Git blob, open issue #1469, proposed AST edit and blackbox fairness
        run: python -m unittest -v research.semrepair.test_maniskill_upstream_rotation_sign_case
      - name: Execute actual ManiSkill original controller and source fix over 128 actions
        run: python -m research.semrepair.maniskill_upstream_rotation_sign_case > real_maniskill_rotation_sign_full.json
      - name: Reveal original upstream source provenance, false universality and negative baseline
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('real_maniskill_rotation_sign_full.json'))
          for key in ('upstream_repository','immutable_main_commit','actual_controller_git_blob',
                      'actual_helper_git_blob','upstream_issue','upstream_open_pr',
                      'PR_merged','tested_controller_actions',
                      'original_controller_error_L2_mean',
                      'compiled_one_ast_attribute_repair_error_L2_max',
                      'equal_info_blackbox_sign_inversion_error_L2_max',
                      'real_robot_or_SAPIEN_task_episodes'):
              print(key,r[key])
          print('SOURCE_REPAIR_OPERATOR',r['source_patch_changes'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semrepair-real-open-maniskill-issue-1469-frozen-128-rotations
          path: real_maniskill_rotation_sign_full.json
          if-no-files-found: warn
          retention-days: 90
