name: P2 real Weibo and BNCI matched whole-record near-identity controls
on:
  push:
    branches: [publication/default-eeg-p2-record-identity-20261013]
    paths: ['research/defaultreg_bspc_v13/src/p2_two_public_cohorts_aligned_nearmatch.py','.github/workflows/p2-near-match-two-control-cohorts.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run-real-EEG-two-control-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MNE_DATA: /tmp/p2-public-two-nearmatch-cohorts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_bspc_v13/src/p2_two_public_cohorts_aligned_nearmatch.py --out /tmp/p2-two-public-nearmatch-negative-control.json
          python - <<'PY'
          import json
          z=json.load(open('/tmp/p2-two-public-nearmatch-negative-control.json'))
          assert z['no_physical_patient_identity_inference']
          assert set(z['dataset_control_results'])=={'Weibo2014','BNCI2014_002'}
          assert all(x['no_target_AUC_or_decoding_outcome_used'] for x in z['dataset_control_results'].values())
          print("P2_REAL_TWO_EXPOSED_PUBLIC_EEG_NEAR_OVERLAP_CONTROL_DONE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-real-aligned-near-overlap-two-independent-public-release-controls
          path: /tmp/p2-two-public-nearmatch-negative-control.json
          if-no-files-found: warn
          retention-days: 90
