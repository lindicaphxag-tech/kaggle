name: P4 exact rational root-isolation strong baseline
on:
  push:
    branches: [publication/default-eeg-p4-rank-certificates-20261013]
    paths:
      - research/defaultreg_bspc_v13/src/p4_sturm_interval_root_baseline.py
      - .github/workflows/p4-sturm-root-isolation-strong-baseline.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-root-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - run: python research/defaultreg_bspc_v13/src/p4_sturm_interval_root_baseline.py --out /tmp/p4-sturm-root-baseline.json
      - name: Check root comparator scope
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/p4-sturm-root-baseline.json'))
          assert len(z['rows'])==8
          assert all(x['all_isolating_intervals_contain_exact_root_with_multiplicity'] for x in z['rows'])
          assert z['not_end_to_end_auc_path_timing']
          print('P4_STRONG_ROOT_ISOLATION_SCOPE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4-exact-rational-root-isolation-strong-baseline
          path: /tmp/p4-sturm-root-baseline.json
          retention-days: 90
