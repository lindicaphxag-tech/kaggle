name: ClinGeom exact declared-chart and 1x1 fusion CPU witness

on:
  pull_request:
    paths:
      - "research/medical_geometry/executed_premix_witness.py"
      - "research/medical_geometry/test_executed_premix_witness.py"
      - "research/medical_geometry/EXACT_PREMIX_EXECUTION_WITNESS.md"
      - ".github/workflows/clingeom-premix-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-fusion-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen CPU-only proof dependencies
        run: |
          python -m pip install "numpy>=1.24,<3" "pytest>=8,<10"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Audit actual model fusion against exact-rational declared-grid reference
        run: |
          python -m pytest -q \
            research/medical_geometry/test_exact_declared_chart_witness.py \
            research/medical_geometry/test_executed_premix_witness.py \
            research/medical_geometry/test_executed_interpolation_witness.py
