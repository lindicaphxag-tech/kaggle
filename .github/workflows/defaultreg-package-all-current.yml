name: Package current DefaultReg kaggle source
# self-only-source-snapshot

on:
  push:
    branches:
      - research/defaultreg-frontier-shin-bnci002-20261010
    paths:
      - '.github/workflows/defaultreg-package-all-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout kaggle frontier branch
        uses: actions/checkout@v4
        with:
          path: kaggle

      - name: Build exact kaggle source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/kaggle/research bundle/kaggle/.github/workflows
          cp -a kaggle/research/defaultreg_frontier bundle/kaggle/research/
          cp kaggle/.github/workflows/defaultreg-frontier-shin-bnci002.yml bundle/kaggle/.github/workflows/
          cp kaggle/.github/workflows/defaultreg-package-all-current.yml bundle/kaggle/.github/workflows/
          {
            echo '# Default Regularisation — kaggle source snapshot'
            echo
            echo "kaggle_head=$(git -C kaggle rev-parse HEAD)"
            echo "packaged_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > bundle/KAGGLE_SOURCE_MANIFEST.md
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/KAGGLE_SOURCE_SHA256.txt

      - name: Upload kaggle source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: defaultreg-current-kaggle-source
          path: bundle/**
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
