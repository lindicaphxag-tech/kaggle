name: P3 Weibo four operators common source two targets
on:
  push:
    branches: [publication/default-eeg-p3-transfer-negative-20261013]
    paths:
      - research/defaultreg_bspc_v13/src/p3_weibo_four_operator_two_target_same_source.py
      - .github/workflows/p3-weibo-four-operator-two-target.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-eeg:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MNE_DATA: /tmp/p3-weibo-four-operators-data
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check moabb==1.7.2
      - name: Fixed eight source participants then two retrospective targets
        run: |
          mkdir -p "$MNE_DATA"
          python research/defaultreg_bspc_v13/src/p3_weibo_four_operator_two_target_same_source.py --out /tmp/p3-weibo-four-operators
      - name: Verify outcome artifact scope
        run: |
          python - <<'PY'
          import json
          z=json.load(open('/tmp/p3-weibo-four-operators/P3_WEIBO_FOUR_OPERATORS_TWO_TARGET_RESULTS.json'))
          assert [r['target_id'] for r in z['rows']]==[9,10]
          assert all(len(r['auc'])==5 for r in z['rows'])
          assert z['all_target_outcomes_previously_exposed_to_project']
          print('P3_WEIBO_FOUR_OPERATOR_TWO_TARGET_SCOPE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-weibo-four-operators-common-source
          path: /tmp/p3-weibo-four-operators/*.json
          if-no-files-found: warn
          retention-days: 90
