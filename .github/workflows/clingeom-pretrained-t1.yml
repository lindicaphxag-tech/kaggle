name: ClinGeom frozen pretrained T1 segmentation geometry

on:
  pull_request:
    paths:
      - "research/medical_geometry/pretrained_t1_geometry.py"
      - "research/medical_geometry/PRETRAINED_T1_WITNESS.md"
      - ".github/workflows/clingeom-pretrained-t1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-t1-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      OMP_NUM_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Reproduce upstream TensorFlow 2.13 numerical environment (CPU)
        run: |
          python -m pip install -U pip
          python -m pip install "tensorflow-cpu==2.13.0" "numpy==1.24.3" "nibabel==3.2.2" "scipy==1.9.3" "matplotlib==3.7.2" "pyyaml==6.0"
      - name: Retrieve exact model source, checkpoint and genuine paired MRI
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ecalabr/brain_mask/ca789fb26b70e359b61a8d52968813dd772fb4b1"
          mkdir -p upstream_brain_mask/model upstream_brain_mask/utilities
          touch upstream_brain_mask/model/__init__.py upstream_brain_mask/utilities/__init__.py
          curl -fL --retry 3 "$base/model/networks.py" -o upstream_brain_mask/model/networks.py
          curl -fL --retry 3 "$base/model/network_layers.py" -o upstream_brain_mask/model/network_layers.py
          curl -fL --retry 3 "$base/utilities/activations.py" -o upstream_brain_mask/utilities/activations.py
          curl -fL --retry 3 "$base/trained_models/t1/t1.yml" -o t1.yml
          curl -fL --retry 3 "$base/trained_models/t1/checkpoints/epoch_20_trainloss_128841.2266.hdf5" -o t1_weights.hdf5
          curl -fL --retry 3 "$base/example_data/example001/example001_t1.nii.gz" -o real_t1.nii.gz
          curl -fL --retry 3 "$base/example_data/example001/example001_brain_mask.nii.gz" -o existing_mask.nii.gz
          test "$(git hash-object upstream_brain_mask/model/networks.py)" = "7af8f0079b38af6fbac82923d3bc2c4cd445faca"
          test "$(git hash-object upstream_brain_mask/model/network_layers.py)" = "95eac930ca13df35ac7e1a6d53337c79e7c7d148"
          test "$(git hash-object upstream_brain_mask/utilities/activations.py)" = "3e3764d985ff2f27b3eb725cae534f5a3bdb8fe0"
          test "$(git hash-object t1.yml)" = "7dcc0cc0fa3b2b19e3b28eac47ab983c502b2022"
          test "$(git hash-object t1_weights.hdf5)" = "6ac54600739585f54d9f612d13264b74965ffd33"
          test "$(git hash-object real_t1.nii.gz)" = "81b1e5260ee4a579d8ac490cac113df9c1cb942f"
          test "$(git hash-object existing_mask.nii.gz)" = "e0dd089b3544da4352e751a24dc27a828904bad7"
          echo "PASS: exact model source/config/checkpoint/MRI/mask fingerprints"
      - name: Load actual pretrained weights and execute fixed CPU inference
        run: |
          python -m research.medical_geometry.pretrained_t1_geometry \
            --image real_t1.nii.gz \
            --existing-mask existing_mask.nii.gz \
            --checkpoint t1_weights.hdf5 \
            --config t1.yml \
            --upstream-root upstream_brain_mask \
            --out artifacts/pretrained_t1
      - name: Verify model-output hashes and non-fabricated findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/pretrained_t1")
          d=json.loads((p/"pretrained_t1_geometry.json").read_text())
          assert d["weights"]["git_blob"]=="6ac54600739585f54d9f612d13264b74965ffd33"
          assert d["model_architecture"]=="Unet3dBneck"
          assert d["model_weight_load"]=="completed without skip_mismatch or by_name"
          assert len(d["prediction_probability_sha256"])==64
          assert 0<=d["prediction_foreground_count"]<=64**3
          assert d["clinical_ground_truth"] is False
          if d["repair_comparison"]=="completed on genuine frozen-checkpoint inference":
              assert d["ni_babel_orientation_agreement"]
              assert d["learned_mask_repaired_patient_grid_dice"]==1.
              assert (p/"fig_actual_pretrained_t1_prediction.png").stat().st_size>10000
          else:
              assert d["repair_comparison"].startswith("REFUSED:")
          print("PASS: genuine checkpoint inference + explicit degenerate-output boundary")
          PY
      - name: Upload genuine frozen model result
        uses: actions/upload-artifact@v4
        with:
          name: ClinGeom-frozen-pretrained-T1-output
          path: artifacts/pretrained_t1/
          if-no-files-found: error
          retention-days: 60
